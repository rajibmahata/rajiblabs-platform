<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Appointment booking flow -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <!-- Mobile booking -->
    <g transform="translate(0, 20)">
      <rect width="100" height="80" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
      <rect x="0" y="0" width="100" height="18" rx="10" fill="#1e1b4b"/>
      <text x="50" y="13" text-anchor="middle" fill="#818cf8" font-family="system-ui" font-size="8">📱 Book Slot</text>
      <rect x="10" y="26" width="80" height="8" rx="3" fill="#1e1b4b"/>
      <rect x="10" y="40" width="80" height="8" rx="3" fill="#1e1b4b"/>
      <rect x="10" y="54" width="40" height="14" rx="4" fill="#4f46e5"/><text x="30" y="64" text-anchor="middle" fill="white" font-family="system-ui" font-size="6">Confirm</text>
      <text x="50" y="76" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="7">Patient Portal</text>
    </g>
    <!-- Scheduling engine -->
    <g transform="translate(120, 20)">
      <rect width="120" height="80" rx="10" fill="#312e81" stroke="#f59e0b" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="18" rx="10" fill="#1e1b4b"/>
      <text x="60" y="13" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="8">📅 Scheduling</text>
      <g transform="translate(10, 26)">
        <rect width="22" height="14" rx="2" fill="#1e1b4b"/><text x="11" y="10" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="6">9am</text>
        <rect x="26" width="22" height="14" rx="2" fill="#4f46e5"/><text x="37" y="10" text-anchor="middle" fill="white" font-family="system-ui" font-size="6">10am</text>
        <rect x="52" width="22" height="14" rx="2" fill="#4f46e5"/><text x="63" y="10" text-anchor="middle" fill="white" font-family="system-ui" font-size="6">11am</text>
        <rect x="78" width="22" height="14" rx="2" fill="#1e1b4b"/><text x="89" y="10" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="6">1pm</text>
        <rect y="18" width="22" height="14" rx="2" fill="#4f46e5"/><text x="11" y="28" text-anchor="middle" fill="white" font-family="system-ui" font-size="6">2pm</text>
        <rect x="26" y="18" width="22" height="14" rx="2" fill="#1e1b4b"/><text x="37" y="28" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="6">3pm</text>
      </g>
      <text x="60" y="76" text-anchor="middle" fill="#c7d2fe" font-family="system-ui" font-size="7">Auto-Scheduling</text>
    </g>
    <!-- Notification -->
    <g transform="translate(260, 20)">
      <rect width="120" height="80" rx="10" fill="#312e81" stroke="#34d399" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="18" rx="10" fill="#1e1b4b"/>
      <text x="60" y="13" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="8">🔔 Notifications</text>
      <text x="60" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">📧 Email</text>
      <text x="60" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">📱 SMS</text>
      <text x="60" y="66" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">📞 Voice Reminder</text>
    </g>
    <!-- Configurable platform -->
    <g transform="translate(0, 130)">
      <rect width="380" height="60" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="0.8"/>
      <text x="190" y="20" text-anchor="middle" fill="#818cf8" font-family="system-ui" font-size="10" font-weight="bold">🏥 Configurable for Any Immunization Program</text>
      <text x="190" y="38" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="8">COVID-19 • Flu • Pediatric • Custom Campaigns</text>
      <text x="190" y="52" text-anchor="middle" fill="#6366f1" font-family="system-ui" font-size="8">Meijer Inc. — Multi-State Deployment</text>
    </g>
    <!-- Impact -->
    <g transform="translate(0, 210)">
      <rect width="120" height="44" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="0.5"/>
      <text x="60" y="18" text-anchor="middle" fill="#818cf8" font-family="system-ui" font-size="16" font-weight="bold">10K+</text>
      <text x="60" y="34" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="7">Appointments Booked</text>
      <rect x="140" width="120" height="44" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="0.5"/>
      <text x="200" y="18" text-anchor="middle" fill="#818cf8" font-family="system-ui" font-size="16" font-weight="bold">50%</text>
      <text x="200" y="34" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="7">Scheduling Time ↓</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-1">Vaccine Distribution</text>
  <text x="50" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-1">Appointment App</text>
  <text x="50" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#c7d2fe">Meijer Inc. — TCS, 2019–Present</text>
  <!-- Features -->
  <g transform="translate(50, 235)" font-family="system-ui" font-size="10">
    <text y="0" fill="#818cf8">▸</text><text x="14" y="0" fill="#e0e7ff">Configurable Appointment Booking Platform</text>
    <text y="16" fill="#818cf8">▸</text><text x="14" y="16" fill="#e0e7ff">Multi-Channel Notifications (Email, SMS, Voice)</text>
    <text y="32" fill="#818cf8">▸</text><text x="14" y="32" fill="#e0e7ff">Multi-State Deployment for Immunization Programs</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="60" height="24" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="1"/><text x="30" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Azure</text>
    <rect x="68" width="60" height="24" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="1"/><text x="98" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">PWA</text>
    <rect x="136" width="60" height="24" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="1"/><text x="166" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">SMS</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#818cf8" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#a78bfa" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#818cf8" opacity="0.3"/>
</svg>
