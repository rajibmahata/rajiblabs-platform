<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#f59e0b" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Car rental aggregator -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <!-- Search -->
    <g transform="translate(0, 20)">
      <rect width="380" height="50" rx="10" fill="#16213e" stroke="#f59e0b" stroke-width="1"/>
      <text x="20" y="22" fill="#f59e0b" font-family="system-ui" font-size="9" font-weight="bold">🔍 Search Cars</text>
      <rect x="20" y="28" width="100" height="14" rx="4" fill="#1a1a2e"/><text x="70" y="38" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Location</text>
      <rect x="130" y="28" width="80" height="14" rx="4" fill="#1a1a2e"/><text x="170" y="38" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Date</text>
      <rect x="220" y="28" width="80" height="14" rx="4" fill="#1a1a2e"/><text x="260" y="38" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Type</text>
      <rect x="310" y="28" width="50" height="14" rx="4" fill="#f59e0b"/><text x="335" y="38" text-anchor="middle" fill="#1a1a2e" font-family="system-ui" font-size="6" font-weight="bold">Go</text>
    </g>
    <!-- Rental options -->
    <g transform="translate(0, 84)">
      <rect width="120" height="70" rx="8" fill="#16213e" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="60" y="22" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="18">🚗</text>
      <text x="60" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Economy</text>
      <text x="60" y="54" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="9" font-weight="bold">$29/day</text>
      <text x="60" y="66" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Hertz • Avis • Budget</text>
      <rect x="130" width="120" height="70" rx="8" fill="#16213e" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="190" y="22" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="18">🚙</text>
      <text x="190" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">SUV</text>
      <text x="190" y="54" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="9" font-weight="bold">$59/day</text>
      <text x="190" y="66" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Enterprise • National</text>
      <rect x="260" width="120" height="70" rx="8" fill="#16213e" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="320" y="22" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="18">🏎️</text>
      <text x="320" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Luxury</text>
      <text x="320" y="54" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="9" font-weight="bold">$129/day</text>
      <text x="320" y="66" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Sixt • Europcar</text>
    </g>
    <!-- Price comparison -->
    <g transform="translate(0, 170)">
      <rect width="380" height="60" rx="10" fill="#16213e" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="190" y="18" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="9" font-weight="bold">💰 Real-Time Price Comparison Across 15+ Rental Companies</text>
      <text x="190" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Best price guaranteed • Instant booking • Free cancellation</text>
      <text x="190" y="50" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="8">Keshri Software Solutions — Company Product</text>
    </g>
    <!-- Impact -->
    <g transform="translate(0, 250)">
      <rect width="120" height="36" rx="8" fill="#16213e" stroke="#f59e0b" stroke-width="0.5"/>
      <text x="60" y="16" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="14" font-weight="bold">15+</text>
      <text x="60" y="30" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="7">Rental Partners</text>
      <rect x="140" width="120" height="36" rx="8" fill="#16213e" stroke="#f59e0b" stroke-width="0.5"/>
      <text x="200" y="16" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="14" font-weight="bold">30%</text>
      <text x="200" y="30" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="7">Avg Savings</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">TRANSZOOM</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fcd34d">Car Rental Aggregator — Best Price Comparison</text>
  <text x="50" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Keshri Software Solutions • Jul 2014 – Feb 2015</text>
  <!-- Features -->
  <g transform="translate(50, 230)" font-family="system-ui" font-size="10">
    <text y="0" fill="#f59e0b">▸</text><text x="14" y="0" fill="#fef3c7">Connecting Customers with Rental Companies</text>
    <text y="16" fill="#f59e0b">▸</text><text x="14" y="16" fill="#fef3c7">Real-Time Price Comparison Across 15+ Providers</text>
    <text y="32" fill="#f59e0b">▸</text><text x="14" y="32" fill="#fef3c7">Instant Booking with Free Cancellation</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="50" height="24" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1"/><text x="25" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Web</text>
    <rect x="58" width="60" height="24" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1"/><text x="88" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Product</text>
    <rect x="126" width="70" height="24" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1"/><text x="161" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Aggregator</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#f59e0b" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#f97316" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#f59e0b" opacity="0.3"/>
</svg>
