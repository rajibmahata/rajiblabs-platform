<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b"/>
      <stop offset="50%" style="stop-color:#27272a"/>
      <stop offset="100%" style="stop-color:#18181b"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Abstract brain/neural visualization -->
  <g transform="translate(450, 100)" filter="url(#glow)">
    <!-- Central brain shape -->
    <ellipse cx="150" cy="120" rx="120" ry="100" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <ellipse cx="150" cy="120" rx="90" ry="75" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
    <ellipse cx="150" cy="120" rx="60" ry="50" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.5"/>
    <!-- Neural nodes -->
    <circle cx="150" cy="120" r="20" fill="#a855f7" opacity="0.8"/>
    <circle cx="150" cy="120" r="12" fill="#c084fc"/>
    <circle cx="100" cy="80" r="8" fill="#c084fc" opacity="0.7"/>
    <circle cx="200" cy="80" r="8" fill="#c084fc" opacity="0.7"/>
    <circle cx="80" cy="140" r="8" fill="#c084fc" opacity="0.7"/>
    <circle cx="220" cy="140" r="8" fill="#c084fc" opacity="0.7"/>
    <circle cx="120" cy="170" r="6" fill="#e879f9" opacity="0.6"/>
    <circle cx="180" cy="170" r="6" fill="#e879f9" opacity="0.6"/>
    <circle cx="150" cy="60" r="6" fill="#e879f9" opacity="0.6"/>
    <circle cx="150" cy="180" r="6" fill="#e879f9" opacity="0.6"/>
    <!-- Connections -->
    <g stroke="#a855f7" stroke-width="0.8" opacity="0.4">
      <line x1="150" y1="120" x2="100" y2="80"/>
      <line x1="150" y1="120" x2="200" y2="80"/>
      <line x1="150" y1="120" x2="80" y2="140"/>
      <line x1="150" y1="120" x2="220" y2="140"/>
      <line x1="150" y1="120" x2="120" y2="170"/>
      <line x1="150" y1="120" x2="180" y2="170"/>
      <line x1="150" y1="120" x2="150" y2="60"/>
      <line x1="150" y1="120" x2="150" y2="180"/>
      <line x1="100" y1="80" x2="80" y2="140"/>
      <line x1="200" y1="80" x2="220" y2="140"/>
      <line x1="100" y1="80" x2="150" y2="60"/>
      <line x1="200" y1="80" x2="150" y2="60"/>
    </g>
    <!-- Orbiting dots -->
    <circle cx="30" cy="60" r="3" fill="#22d3ee" opacity="0.6"/>
    <circle cx="270" cy="60" r="3" fill="#22d3ee" opacity="0.6"/>
    <circle cx="30" cy="180" r="3" fill="#22d3ee" opacity="0.6"/>
    <circle cx="270" cy="180" r="3" fill="#22d3ee" opacity="0.6"/>
  </g>
  <!-- Title -->
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">RajibLabs</text>
  <text x="60" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#a1a1aa">AI-First Software &amp; Innovation Platform</text>
  <!-- Tech badges -->
  <g transform="translate(60, 235)">
    <rect x="0" y="0" width="68" height="28" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="34" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">React</text>
    <rect x="76" y="0" width="76" height="28" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="114" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">FastAPI</text>
    <rect x="160" y="0" width="82" height="28" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="201" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">MongoDB</text>
    <rect x="250" y="0" width="50" height="28" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="275" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">RAG</text>
    <rect x="308" y="0" width="76" height="28" rx="14" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <text x="346" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">OpenAI</text>
  </g>
  <!-- Features -->
  <g transform="translate(60, 285)" opacity="0.7">
    <text x="0" y="0" fill="#a855f7" font-family="system-ui" font-size="13">Agentic Systems</text>
    <text x="145" y="0" fill="#a855f7" font-family="system-ui" font-size="13">RAG Pipeline</text>
    <text x="260" y="0" fill="#a855f7" font-family="system-ui" font-size="13">Portfolio Intelligence</text>
    <text x="445" y="0" fill="#a855f7" font-family="system-ui" font-size="13">12+ Years Enterprise</text>
  </g>
  <!-- Floating particles -->
  <circle cx="380" cy="60" r="2" fill="#a855f7" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#c084fc" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#22d3ee" opacity="0.3"/>
  <circle cx="750" cy="100" r="1.5" fill="#e879f9" opacity="0.5"/>
</svg>
