      <text x="52" y="32" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="12">📱</text>
      <text x="52" y="58" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="7">iPhone 14 Pro</text>
      <text x="52" y="70" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="8" font-weight="bold">$899</text>
      <rect x="115" width="105" height="80" rx="6" fill="#1a1a2e"/>
      <rect x="123" y="8" width="89" height="40" rx="4" fill="#22d3ee" opacity="0.1"/>
      <text x="167" y="32" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="12">💻</text>
      <text x="167" y="58" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="7">MacBook Air M2</text>
      <text x="167" y="70" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="8" font-weight="bold">$1,299</text>
      <rect x="230" width="105" height="80" rx="6" fill="#1a1a2e"/>
      <rect x="238" y="8" width="89" height="40" rx="4" fill="#22d3ee" opacity="0.1"/>
      <text x="282" y="32" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="12">🎮</text>
      <text x="282" y="58" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="7">PS5 Bundle</text>
      <text x="282" y="70" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="8" font-weight="bold">$549</text>
