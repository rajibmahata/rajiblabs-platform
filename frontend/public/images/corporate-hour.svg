  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">Corporate Hour</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7dd3fc">Online Classifieds Marketplace</text>
  <text x="50" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Keshri Software Solutions • Jul 2014 – Feb 2015</text>
  <!-- Features -->
  <g transform="translate(50, 230)" font-family="system-ui" font-size="10">
    <text y="0" fill="#22d3ee">▸</text><text x="14" y="0" fill="#e2e8f0">Multi-Category Classifieds Platform</text>
    <text y="16" fill="#22d3ee">▸</text><text x="14" y="16" fill="#e2e8f0">User Listings, Search, Chat &amp; Ratings</text>
    <text y="32" fill="#22d3ee">▸</text><text x="14" y="32" fill="#e2e8f0">Real-Time Messaging Between Buyers &amp; Sellers</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="50" height="24" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1"/><text x="25" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Web</text>
    <rect x="58" width="60" height="24" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1"/><text x="88" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Product</text>
    <rect x="126" width="70" height="24" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1"/><text x="161" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">MVP Built</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#22d3ee" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#06b6d4" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#22d3ee" opacity="0.3"/>
</svg>
