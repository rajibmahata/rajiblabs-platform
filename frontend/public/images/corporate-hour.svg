      <text x="120" y="20" fill="#22d3ee" font-family="system-ui" font-size="8">🔍 Search</text>
      <text x="210" y="20" fill="#22d3ee" font-family="system-ui" font-size="8">💬 Chat</text>
      <text x="290" y="20" fill="#22d3ee" font-family="system-ui" font-size="8">⭐ Rate</text>
