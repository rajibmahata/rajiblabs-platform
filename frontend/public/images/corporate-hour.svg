    <!-- Category tabs -->
    <g transform="translate(14, 38)">
      <rect width="70" height="18" rx="4" fill="#22d3ee" opacity="0.2"/><text x="35" y="13" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="7">All</text>
      <rect x="78" width="70" height="18" rx="4" fill="#1a1a2e"/><text x="113" y="13" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Electronics</text>
      <rect x="156" width="70" height="18" rx="4" fill="#1a1a2e"/><text x="191" y="13" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Services</text>
      <rect x="234" width="70" height="18" rx="4" fill="#1a1a2e"/><text x="269" y="13" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Jobs</text>
