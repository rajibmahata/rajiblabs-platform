      <text x="52" y="26" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Listings</text>
      <rect x="115" width="105" height="32" rx="6" fill="#1a1a2e"/>
      <text x="167" y="14" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="bold">500+</text>
      <text x="167" y="26" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Users</text>
      <rect x="230" width="105" height="32" rx="6" fill="#1a1a2e"/>
      <text x="282" y="14" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="11" font-weight="bold">50+</text>
      <text x="282" y="26" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Categories</text>
