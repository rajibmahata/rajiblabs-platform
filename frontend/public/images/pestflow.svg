<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#22d3ee" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="450"/><line x1="800" y1="0" x2="0" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/><line x1="0" y1="225" x2="800" y2="225"/>
    <circle cx="400" cy="225" r="150" fill="none"/><circle cx="400" cy="225" r="250" fill="none"/>
  </g>
  <!-- Dashboard mockup -->
  <g transform="translate(420, 80)" filter="url(#glow)">
    <rect x="0" y="0" width="320" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="320" height="32" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/><circle cx="36" cy="16" r="5" fill="#eab308"/><circle cx="52" cy="16" r="5" fill="#22c55e"/>
    <text x="160" y="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">PestFlow Dashboard</text>
    <!-- Stats cards -->
    <rect x="16" y="44" width="90" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="61" y="64" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="18" font-weight="bold">247</text>
    <text x="61" y="82" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="9">Active Jobs</text>
    <rect x="115" y="44" width="90" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="160" y="64" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="18" font-weight="bold">98%</text>
    <text x="160" y="82" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="9">Completion</text>
    <rect x="214" y="44" width="90" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="259" y="64" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="18" font-weight="bold">12</text>
    <text x="259" y="82" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="9">Technicians</text>
    <!-- Chart bars -->
    <g transform="translate(16, 108)">
      <rect x="0" y="30" width="18" height="50" rx="3" fill="#22d3ee" opacity="0.8"/>
      <rect x="26" y="15" width="18" height="65" rx="3" fill="#22d3ee" opacity="0.9"/>
      <rect x="52" y="25" width="18" height="55" rx="3" fill="#22d3ee"/>
      <rect x="78" y="10" width="18" height="70" rx="3" fill="#10b981"/>
      <rect x="104" y="20" width="18" height="60" rx="3" fill="#22d3ee" opacity="0.7"/>
      <rect x="130" y="5" width="18" height="75" rx="3" fill="#10b981" opacity="0.9"/>
      <rect x="156" y="18" width="18" height="62" rx="3" fill="#22d3ee" opacity="0.85"/>
      <rect x="182" y="8" width="18" height="72" rx="3" fill="#10b981"/>
      <rect x="208" y="22" width="18" height="58" rx="3" fill="#22d3ee" opacity="0.75"/>
      <rect x="234" y="12" width="18" height="68" rx="3" fill="#10b981" opacity="0.85"/>
      <rect x="260" y="3" width="18" height="77" rx="3" fill="#22d3ee"/>
      <rect x="286" y="16" width="18" height="64" rx="3" fill="#10b981" opacity="0.9"/>
    </g>
  </g>
  <!-- Title -->
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">PestFlow</text>
  <text x="60" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">Pest-Control Business Platform</text>
  <!-- Tech badges -->
  <g transform="translate(60, 235)">
    <rect x="0" y="0" width="60" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">.NET</text>
    <rect x="68" y="0" width="85" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">SQL Server</text>
    <rect x="161" y="0" width="82" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="202" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">SignalR</text>
  </g>
  <!-- Feature pills -->
  <g transform="translate(60, 285)" opacity="0.7">
    <text x="0" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">Multi-tenant</text>
    <text x="110" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">GST Quotations</text>
    <text x="245" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">Real-time Updates</text>
    <text x="405" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">Payment Plans</text>
  </g>
  <!-- Floating particles -->
  <circle cx="380" cy="60" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#10b981" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#22d3ee" opacity="0.3"/>
  <circle cx="750" cy="100" r="1.5" fill="#06b6d4" opacity="0.5"/>
</svg>
