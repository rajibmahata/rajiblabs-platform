<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="50%" style="stop-color:#065f46"/>
      <stop offset="100%" style="stop-color:#064e3b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#34d399" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Prescription refill pipeline -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <!-- Patient input -->
    <g transform="translate(0, 20)">
      <rect width="100" height="60" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="14">📱</text>
      <text x="50" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">SMS / Voice</text>
      <text x="50" y="52" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="7">Patient Request</text>
    </g>
    <!-- Rule engine -->
    <g transform="translate(120, 20)">
      <rect width="100" height="60" rx="8" fill="#065f46" stroke="#f59e0b" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="14">⚙️</text>
      <text x="50" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Rule Engine</text>
      <text x="50" y="52" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="7">Auto-Refill Logic</text>
    </g>
    <line x1="100" y1="50" x2="120" y2="50" stroke="#34d399" stroke-width="0.8" opacity="0.4"/>
    <!-- Pharmacy system -->
    <g transform="translate(240, 20)">
      <rect width="100" height="60" rx="8" fill="#065f46" stroke="#6ee7b7" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="14">💊</text>
      <text x="50" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Pharmacy</text>
      <text x="50" y="52" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="7">Refill Processed</text>
    </g>
    <line x1="220" y1="50" x2="240" y2="50" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
    <!-- Automation flow -->
    <g transform="translate(0, 110)">
      <rect width="340" height="100" rx="10" fill="#065f46" stroke="#34d399" stroke-width="1"/>
      <text x="170" y="20" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="10" font-weight="bold">🔄 Automated Refill Workflow</text>
      <g transform="translate(14, 30)">
        <rect width="95" height="28" rx="6" fill="#064e3b"/><text x="48" y="18" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="7">1. SMS Received</text>
        <rect x="103" width="95" height="28" rx="6" fill="#064e3b"/><text x="150" y="18" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="7">2. Rules Evaluated</text>
        <rect x="206" width="95" height="28" rx="6" fill="#064e3b"/><text x="254" y="18" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="7">3. Refill Sent</text>
      </g>
      <text x="170" y="80" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="8">Multi-channel: SMS, Voice IVR, Web Portal</text>
      <text x="170" y="94" text-anchor="middle" fill="#059669" font-family="system-ui" font-size="8">Zero Manual Intervention for Standard Refills</text>
    </g>
    <!-- Impact -->
    <g transform="translate(0, 230)">
      <rect width="160" height="44" rx="8" fill="#065f46" stroke="#34d399" stroke-width="0.5"/>
      <text x="80" y="18" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="16" font-weight="bold">75%</text>
      <text x="80" y="34" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="7">Manual Work Eliminated</text>
      <rect x="180" width="160" height="44" rx="8" fill="#065f46" stroke="#34d399" stroke-width="0.5"/>
      <text x="260" y="18" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="16" font-weight="bold">2019+</text>
      <text x="260" y="34" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="7">Meijer Inc. TCS</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-1">Smart Refilling Process</text>
  <text x="50" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a7f3d0">Automated Prescription Refill System</text>
  <text x="50" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6ee7b7">Meijer Inc. — TCS, 2019–Present</text>
  <!-- Features -->
  <g transform="translate(50, 225)" font-family="system-ui" font-size="10">
    <text y="0" fill="#34d399">▸</text><text x="14" y="0" fill="#d1fae5">SMS &amp; Voice-Based Refill Requests</text>
    <text y="16" fill="#34d399">▸</text><text x="14" y="16" fill="#d1fae5">Custom Rule Engine for Auto-Refill</text>
    <text y="32" fill="#34d399">▸</text><text x="14" y="32" fill="#d1fae5">Multi-Channel: SMS, IVR, Web</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="48" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1"/><text x="24" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">SMS</text>
    <rect x="56" width="90" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1"/><text x="101" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Rule Engine</text>
    <rect x="154" width="60" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1"/><text x="184" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Voice</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#34d399" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#10b981" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#059669" opacity="0.3"/>
</svg>
