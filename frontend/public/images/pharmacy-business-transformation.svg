<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="50%" style="stop-color:#075985"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#38bdf8" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Pharmacy API architecture -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <!-- PWA device -->
    <g transform="translate(0, 20)">
      <rect width="120" height="90" rx="10" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="20" rx="10" fill="#0c4a6e"/>
      <text x="60" y="14" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">📱 PWA</text>
      <rect x="10" y="28" width="100" height="10" rx="3" fill="#0c4a6e"/>
      <rect x="10" y="44" width="80" height="10" rx="3" fill="#0c4a6e"/>
      <rect x="10" y="60" width="100" height="10" rx="3" fill="#0c4a6e"/>
      <text x="60" y="84" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="7">Progressive Web App</text>
    </g>
    <!-- Open APIs -->
    <g transform="translate(140, 20)">
      <rect width="120" height="90" rx="10" fill="#075985" stroke="#22d3ee" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="20" rx="10" fill="#0c4a6e"/>
      <text x="60" y="14" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="8">🔗 Open APIs</text>
      <text x="60" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9" font-weight="bold">REST</text>
      <text x="60" y="55" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9" font-weight="bold">FHIR</text>
      <text x="60" y="70" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9" font-weight="bold">HL7</text>
      <text x="60" y="84" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="7">Vendor Integration</text>
    </g>
    <!-- Rule Engine -->
    <g transform="translate(280, 20)">
      <rect width="110" height="90" rx="10" fill="#075985" stroke="#f59e0b" stroke-width="1"/>
      <rect x="0" y="0" width="110" height="20" rx="10" fill="#0c4a6e"/>
      <text x="55" y="14" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="8">⚙️ Rule Engine</text>
      <text x="55" y="42" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">IF formulary_match</text>
      <text x="55" y="56" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">AND prior_auth OK</text>
      <text x="55" y="70" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">THEN approve</text>
      <text x="55" y="84" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="7">Business Rules</text>
    </g>
    <!-- Azure Cloud -->
    <g transform="translate(0, 140)">
      <rect width="400" height="50" rx="10" fill="#075985" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="200" y="20" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="10" font-weight="bold">☁️ Microsoft Azure Cloud</text>
      <text x="200" y="38" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="8">App Service • SQL Database • API Management • Key Vault</text>
    </g>
    <!-- Impact stats -->
    <g transform="translate(0, 210)">
      <rect width="120" height="44" rx="8" fill="#075985" stroke="#22d3ee" stroke-width="0.5"/>
      <text x="60" y="18" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="16" font-weight="bold">40%</text>
      <text x="60" y="34" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="7">Vendor Dependency ↓</text>
      <rect x="140" width="120" height="44" rx="8" fill="#075985" stroke="#22d3ee" stroke-width="0.5"/>
      <text x="200" y="18" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="16" font-weight="bold">60+</text>
      <text x="200" y="34" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="7">API Endpoints</text>
      <rect x="280" width="120" height="44" rx="8" fill="#075985" stroke="#22d3ee" stroke-width="0.5"/>
      <text x="340" y="18" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="16" font-weight="bold">2019+</text>
      <text x="340" y="34" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="7">Meijer Inc. TCS</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="white" letter-spacing="-1">Pharmacy Business</text>
  <text x="50" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="white" letter-spacing="-1">Transformation</text>
  <text x="50" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#bae6fd">Meijer Inc. — TCS, 2019–Present</text>
  <!-- Features -->
  <g transform="translate(50, 235)" font-family="system-ui" font-size="10">
    <text y="0" fill="#38bdf8">▸</text><text x="14" y="0" fill="#e0f2fe">Open APIs Reduced Third-Party Vendor Dependency</text>
    <text y="16" fill="#38bdf8">▸</text><text x="14" y="16" fill="#e0f2fe">Progressive Web App for Pharmacy Operations</text>
    <text y="32" fill="#38bdf8">▸</text><text x="14" y="32" fill="#e0f2fe">Rule Engine for Formulary &amp; Prior Authorization</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="60" height="24" rx="12" fill="#075985" stroke="#38bdf8" stroke-width="1"/><text x="30" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Azure</text>
    <rect x="68" width="40" height="24" rx="12" fill="#075985" stroke="#38bdf8" stroke-width="1"/><text x="88" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">PWA</text>
    <rect x="116" width="80" height="24" rx="12" fill="#075985" stroke="#38bdf8" stroke-width="1"/><text x="156" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Rule Engine</text>
    <rect x="204" width="60" height="24" rx="12" fill="#075985" stroke="#38bdf8" stroke-width="1"/><text x="234" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Open APIs</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#38bdf8" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#0ea5e9" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#38bdf8" opacity="0.3"/>
</svg>
