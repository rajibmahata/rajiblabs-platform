<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="50%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Website mockup -->
  <g transform="translate(400, 50)" filter="url(#glow)">
    <!-- Browser chrome -->
    <rect x="0" y="0" width="360" height="280" rx="12" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="36" rx="12" fill="#14532d"/>
    <circle cx="22" cy="18" r="5" fill="#ef4444"/><circle cx="38" cy="18" r="5" fill="#eab308"/><circle cx="54" cy="18" r="5" fill="#22c55e"/>
    <rect x="80" y="10" width="200" height="16" rx="8" fill="#052e16"/>
    <text x="180" y="22" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="10">fryyofoods.com</text>
    <!-- Website content -->
    <rect x="0" y="36" width="360" height="80" fill="#14532d"/>
    <text x="180" y="70" text-anchor="middle" fill="white" font-family="system-ui" font-size="20" font-weight="bold">Fryyo Foods</text>
    <text x="180" y="95" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="11">Fresh &amp; Authentic Flavors</text>
    <!-- Product cards -->
    <g transform="translate(20, 126)">
      <rect x="0" y="0" width="100" height="70" rx="8" fill="#14532d"/>
      <rect x="10" y="10" width="80" height="35" rx="4" fill="#166534"/>
      <text x="50" y="60" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="9">Products</text>
      <rect x="120" y="0" width="100" height="70" rx="8" fill="#14532d"/>
      <rect x="130" y="10" width="80" height="35" rx="4" fill="#166534"/>
      <text x="170" y="60" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="9">Recipes</text>
      <rect x="240" y="0" width="100" height="70" rx="8" fill="#14532d"/>
      <rect x="250" y="10" width="80" height="35" rx="4" fill="#166534"/>
      <text x="290" y="60" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="9">Orders</text>
    </g>
    <!-- CMS admin bar -->
    <rect x="0" y="210" width="360" height="70" fill="#052e16" stroke="#16a34a" stroke-width="0.5" stroke-dasharray="4,4"/>
    <text x="180" y="240" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="10">CMS Admin</text>
    <rect x="20" y="252" width="60" height="16" rx="4" fill="#166534"/><text x="50" y="264" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="8">Edit</text>
    <rect x="90" y="252" width="60" height="16" rx="4" fill="#166534"/><text x="120" y="264" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="8">Upload</text>
    <rect x="160" y="252" width="60" height="16" rx="4" fill="#166534"/><text x="190" y="264" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="8">Preview</text>
    <rect x="230" y="252" width="60" height="16" rx="4" fill="#166534"/><text x="260" y="264" text-anchor="middle" fill="#86efac" font-family="system-ui" font-size="8">Publish</text>
  </g>
  <!-- Title -->
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">RM Enterprise CMS</text>
  <text x="60" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#86efac">Business Website &amp; Content Management</text>
  <!-- Tech badges -->
  <g transform="translate(60, 235)">
    <rect x="0" y="0" width="50" height="28" rx="14" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
    <text x="25" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Web</text>
    <rect x="58" y="0" width="50" height="28" rx="14" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
    <text x="83" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">CMS</text>
  </g>
  <!-- Features -->
  <g transform="translate(60, 285)" opacity="0.7">
    <text x="0" y="0" fill="#34d399" font-family="system-ui" font-size="13">Content Management</text>
    <text x="170" y="0" fill="#34d399" font-family="system-ui" font-size="13">Live in Production</text>
    <text x="330" y="0" fill="#34d399" font-family="system-ui" font-size="13">Real Food Business</text>
  </g>
  <!-- Floating particles -->
  <circle cx="380" cy="60" r="2" fill="#34d399" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#10b981" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#34d399" opacity="0.3"/>
  <circle cx="750" cy="100" r="1.5" fill="#059669" opacity="0.5"/>
</svg>
