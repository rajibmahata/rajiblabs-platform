  <circle cx="370" cy="50" r="2" fill="#34d399" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#10b981" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#059669" opacity="0.3"/>
