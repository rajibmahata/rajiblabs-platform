<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#22c55e" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Health dashboard mockup -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <rect x="0" y="0" width="360" height="240" rx="12" fill="#16213e" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="30" rx="12" fill="#1a1a2e"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444"/><circle cx="34" cy="15" r="5" fill="#eab308"/><circle cx="50" cy="15" r="5" fill="#22c55e"/>
    <text x="180" y="19" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="10">💪 Empowering Weighs — Health Dashboard</text>
    <!-- Weight tracking chart -->
    <g transform="translate(14, 38)">
      <rect width="332" height="80" rx="6" fill="#1a1a2e"/>
      <text x="12" y="16" fill="#22c55e" font-family="system-ui" font-size="8" font-weight="bold">Weight Progress</text>
      <path d="M12,65 L38,58 L64,52 L90,48 L116,44 L142,42 L168,38 L194,35 L220,32 L246,30 L272,28 L298,25 L310,22" fill="none" stroke="#22c55e" stroke-width="2"/>
      <path d="M12,65 L38,58 L64,52 L90,48 L116,44 L142,42 L168,38 L194,35 L220,32 L246,30 L272,28 L298,25 L310,22 L310,72 L12,72 Z" fill="#22c55e" opacity="0.1"/>
      <text x="12" y="72" fill="#64748b" font-family="system-ui" font-size="6">Jan</text>
      <text x="310" y="72" fill="#64748b" font-family="system-ui" font-size="6">Dec</text>
      <text x="310" y="20" fill="#22c55e" font-family="system-ui" font-size="7" font-weight="bold">-15kg</text>
    </g>
    <!-- Health metrics -->
    <g transform="translate(14, 128)">
      <rect width="105" height="44" rx="6" fill="#1a1a2e"/>
      <text x="52" y="18" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="14" font-weight="bold">72</text>
      <text x="52" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">BMI Now</text>
      <text x="52" y="40" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="6">↓ from 87</text>
      <rect x="115" width="105" height="44" rx="6" fill="#1a1a2e"/>
      <text x="167" y="18" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="14" font-weight="bold">5/7</text>
      <text x="167" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Workouts</text>
      <text x="167" y="40" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="6">This Week</text>
      <rect x="230" width="105" height="44" rx="6" fill="#1a1a2e"/>
      <text x="282" y="18" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="14" font-weight="bold">1,800</text>
      <text x="282" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Calories</text>
      <text x="282" y="40" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="6">Daily Avg</text>
    </g>
    <!-- Meal plan -->
    <g transform="translate(14, 182)">
      <rect width="332" height="46" rx="6" fill="#1a1a2e"/>
      <text x="16" y="18" fill="#22c55e" font-family="system-ui" font-size="8">🥗 Today's Meal Plan</text>
      <text x="16" y="32" fill="#a1a1aa" font-family="system-ui" font-size="7">Breakfast: Oatmeal + Berries • Lunch: Grilled Chicken Salad • Dinner: Salmon + Vegetables</text>
      <text x="16" y="42" fill="#64748b" font-family="system-ui" font-size="6">Medically Guided • Personalized for Your Goals</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="white" letter-spacing="-1">Empowering Weighs</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#86efac">Medically Guided Weight-Management Platform</text>
  <text x="50" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Keshri Software Solutions • Jul 2013 – Feb 2014</text>
  <!-- Features -->
  <g transform="translate(50, 230)" font-family="system-ui" font-size="10">
    <text y="0" fill="#22c55e">▸</text><text x="14" y="0" fill="#dcfce7">Medically Guided Weight-Management Plans</text>
    <text y="16" fill="#22c55e">▸</text><text x="14" y="16" fill="#dcfce7">Personalized Meal Plans &amp; Workout Tracking</text>
    <text y="32" fill="#22c55e">▸</text><text x="14" y="32" fill="#dcfce7">Progress Dashboard with BMI &amp; Calorie Tracking</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="50" height="24" rx="12" fill="#16213e" stroke="#22c55e" stroke-width="1"/><text x="25" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Web</text>
    <rect x="58" width="60" height="24" rx="12" fill="#16213e" stroke="#22c55e" stroke-width="1"/><text x="88" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Health</text>
    <rect x="126" width="60" height="24" rx="12" fill="#16213e" stroke="#22c55e" stroke-width="1"/><text x="156" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Product</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#22c55e" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#10b981" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#22c55e" opacity="0.3"/>
</svg>
