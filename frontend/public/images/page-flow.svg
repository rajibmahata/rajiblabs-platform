<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#22d3ee" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- CMS mockup -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <rect x="0" y="0" width="360" height="240" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="30" rx="12" fill="#1a1a2e"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444"/><circle cx="34" cy="15" r="5" fill="#eab308"/><circle cx="50" cy="15" r="5" fill="#22c55e"/>
    <text x="180" y="19" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="10">📄 Page Flow — Content CMS</text>
    <!-- Page list -->
    <g transform="translate(14, 38)">
      <rect width="332" height="80" rx="6" fill="#1a1a2e"/>
      <text x="12" y="16" fill="#22d3ee" font-family="system-ui" font-size="8" font-weight="bold">Pages</text>
      <g transform="translate(0, 22)">
        <rect width="332" height="14" rx="3" fill="#16213e"/><text x="10" y="10" fill="#e2e8f0" font-family="system-ui" font-size="6">Home • Published • 2h ago</text><text x="280" y="10" fill="#22d3ee" font-family="system-ui" font-size="6">Edit</text>
        <rect y="18" width="332" height="14" rx="3" fill="#16213e"/><text x="10" y="28" fill="#e2e8f0" font-family="system-ui" font-size="6">About • Published • 1d ago</text><text x="280" y="28" fill="#22d3ee" font-family="system-ui" font-size="6">Edit</text>
        <rect y="36" width="332" height="14" rx="3" fill="#16213e"/><text x="10" y="46" fill="#e2e8f0" font-family="system-ui" font-size="6">Services • Draft • 3d ago</text><text x="280" y="46" fill="#f59e0b" font-family="system-ui" font-size="6">Edit</text>
      </g>
    </g>
    <!-- Editor -->
    <g transform="translate(14, 128)">
      <rect width="332" height="96" rx="6" fill="#1a1a2e"/>
      <text x="12" y="16" fill="#22d3ee" font-family="system-ui" font-size="8" font-weight="bold">✏️ Visual Editor</text>
      <rect x="12" y="22" width="308" height="16" rx="3" fill="#16213e"/><text x="20" y="33" fill="#e2e8f0" font-family="system-ui" font-size="6">Title: Welcome to Our Business</text>
      <rect x="12" y="42" width="308" height="28" rx="3" fill="#16213e"/><text x="20" y="54" fill="#a1a1aa" font-family="system-ui" font-size="6">Body: Rich text editor with formatting, images, and embeds...</text>
      <g transform="translate(12, 76)">
        <rect width="50" height="12" rx="3" fill="#22d3ee" opacity="0.2"/><text x="25" y="9" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="6">Save</text>
        <rect x="56" width="50" height="12" rx="3" fill="#22c55e" opacity="0.2"/><text x="81" y="9" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="6">Publish</text>
        <rect x="112" width="50" height="12" rx="3" fill="#f59e0b" opacity="0.2"/><text x="137" y="9" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="6">Preview</text>
      </g>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">Page Flow</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7dd3fc">Content Management System</text>
  <text x="50" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Keshri Software Solutions — Company Product</text>
  <!-- Features -->
  <g transform="translate(50, 230)" font-family="system-ui" font-size="10">
    <text y="0" fill="#22d3ee">▸</text><text x="14" y="0" fill="#e0f2fe">Visual Page Editor with Rich Text</text>
    <text y="16" fill="#22d3ee">▸</text><text x="14" y="16" fill="#e0f2fe">Page Management with Version History</text>
    <text y="32" fill="#22d3ee">▸</text><text x="14" y="32" fill="#e0f2fe">Draft → Preview → Publish Workflow</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="50" height="24" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1"/><text x="25" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">CMS</text>
    <rect x="58" width="50" height="24" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1"/><text x="83" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Web</text>
    <rect x="116" width="60" height="24" rx="12" fill="#16213e" stroke="#22d3ee" stroke-width="1"/><text x="146" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Product</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#22d3ee" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#06b6d4" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#22d3ee" opacity="0.3"/>
</svg>
