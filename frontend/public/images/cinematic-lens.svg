<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#e94560" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Video platform mockup -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <rect x="0" y="0" width="360" height="220" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="30" rx="12" fill="#1a1a2e"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444"/><circle cx="34" cy="15" r="5" fill="#eab308"/><circle cx="50" cy="15" r="5" fill="#22c55e"/>
    <text x="180" y="19" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="10">🎬 Cinematic Lens — Video Platform</text>
    <!-- Video grid -->
    <g transform="translate(14, 40)">
      <rect width="105" height="70" rx="6" fill="#1a1a2e"/>
      <text x="52" y="30" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="20">▶</text>
      <text x="52" y="50" text-anchor="middle" fill="#a1a1aa" font-family="system-ui" font-size="7">Corporate Profile</text>
      <text x="52" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">2:34 • HD</text>
      <rect x="115" width="105" height="70" rx="6" fill="#1a1a2e"/>
      <text x="167" y="30" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="20">▶</text>
      <text x="167" y="50" text-anchor="middle" fill="#a1a1aa" font-family="system-ui" font-size="7">Product Demo</text>
      <text x="167" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">5:12 • HD</text>
      <rect x="230" width="105" height="70" rx="6" fill="#1a1a2e"/>
      <text x="282" y="30" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="20">▶</text>
      <text x="282" y="50" text-anchor="middle" fill="#a1a1aa" font-family="system-ui" font-size="7">Testimonial</text>
      <text x="282" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">1:45 • SD</text>
    </g>
    <!-- Upload + edit tools -->
    <g transform="translate(14, 120)">
      <rect width="332" height="40" rx="6" fill="#1a1a2e"/>
      <text x="20" y="24" fill="#e94560" font-family="system-ui" font-size="9">📤 Upload</text>
      <text x="100" y="24" fill="#e94560" font-family="system-ui" font-size="9">✂️ Trim</text>
      <text x="170" y="24" fill="#e94560" font-family="system-ui" font-size="9">🎨 Brand</text>
      <text x="240" y="24" fill="#e94560" font-family="system-ui" font-size="9">📊 Analytics</text>
      <text x="310" y="24" fill="#e94560" font-family="system-ui" font-size="9">🚀</text>
    </g>
    <!-- Stats -->
    <g transform="translate(14, 170)">
      <rect width="105" height="36" rx="6" fill="#1a1a2e"/>
      <text x="52" y="16" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="12" font-weight="bold">50+</text>
      <text x="52" y="30" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Videos Created</text>
      <rect x="115" width="105" height="36" rx="6" fill="#1a1a2e"/>
      <text x="167" y="16" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="12" font-weight="bold">4K</text>
      <text x="167" y="30" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Max Resolution</text>
      <rect x="230" width="105" height="36" rx="6" fill="#1a1a2e"/>
      <text x="282" y="16" text-anchor="middle" fill="#e94560" font-family="system-ui" font-size="12" font-weight="bold">∞</text>
      <text x="282" y="30" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Cloud Storage</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">Cinematic Lens</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fda4af">Corporate Marketing Video Platform</text>
  <text x="50" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Keshri Software Solutions • Jul 2015 – Feb 2016</text>
  <!-- Features -->
  <g transform="translate(50, 230)" font-family="system-ui" font-size="10">
    <text y="0" fill="#e94560">▸</text><text x="14" y="0" fill="#e2e8f0">Corporate Marketing Video Creation &amp; Hosting</text>
    <text y="16" fill="#e94560">▸</text><text x="14" y="16" fill="#e2e8f0">Upload, Trim, Brand, and Analytics Dashboard</text>
    <text y="32" fill="#e94560">▸</text><text x="14" y="32" fill="#e2e8f0">Cloud-Based Video Management</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="60" height="24" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1"/><text x="30" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Video</text>
    <rect x="68" width="50" height="24" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1"/><text x="93" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Cloud</text>
    <rect x="126" width="60" height="24" rx="12" fill="#16213e" stroke="#e94560" stroke-width="1"/><text x="156" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Product</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#e94560" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#e94560" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#e94560" opacity="0.3"/>
</svg>
