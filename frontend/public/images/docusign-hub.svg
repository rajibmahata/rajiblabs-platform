<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Signature workflow visualization -->
  <g transform="translate(420, 60)" filter="url(#glow)">
    <!-- Document -->
    <rect x="0" y="30" width="180" height="240" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="50" width="100" height="8" rx="4" fill="#6366f1" opacity="0.6"/>
    <rect x="20" y="68" width="140" height="5" rx="2" fill="#4f46e5" opacity="0.3"/>
    <rect x="20" y="80" width="130" height="5" rx="2" fill="#4f46e5" opacity="0.3"/>
    <rect x="20" y="92" width="140" height="5" rx="2" fill="#4f46e5" opacity="0.3"/>
    <rect x="20" y="104" width="80" height="5" rx="2" fill="#4f46e5" opacity="0.3"/>
    <!-- Signature line -->
    <line x1="20" y1="160" x2="160" y2="160" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="90" y="175" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="10">Signature</text>
    <!-- Signature flourish -->
    <path d="M40,155 Q60,140 80,155 Q100,170 120,150" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <!-- Checkmark -->
    <circle cx="145" cy="35" r="12" fill="#10b981"/>
    <path d="M139,35 L143,39 L151,31" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Workflow arrows -->
    <g opacity="0.5">
      <circle cx="210" cy="80" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="210" y="84" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="16">1</text>
      <circle cx="260" cy="150" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="260" y="154" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="16">2</text>
      <circle cx="210" cy="220" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="210" y="224" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="16">3</text>
      <path d="M225,85 L245,135" fill="none" stroke="#8b5cf6" stroke-width="1"/>
      <path d="M245,165 L225,205" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    </g>
    <!-- Blockchain icon -->
    <g transform="translate(280, 200)">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#6366f1" opacity="0.3"/>
      <text x="15" y="20" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="14">⛓</text>
    </g>
  </g>
  <!-- Title -->
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1">DocuSign Hub</text>
  <text x="60" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#c4b5fd">Digital Signature SaaS Platform</text>
  <!-- Tech badges -->
  <g transform="translate(60, 235)">
    <rect x="0" y="0" width="60" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="30" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">.NET</text>
    <rect x="68" y="0" width="68" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="102" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">React</text>
    <rect x="144" y="0" width="60" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="174" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Azure</text>
    <rect x="212" y="0" width="60" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="242" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Stripe</text>
    <rect x="280" y="0" width="68" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="314" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">OpenAI</text>
  </g>
  <!-- Features -->
  <g transform="translate(60, 285)" opacity="0.7">
    <text x="0" y="0" fill="#a78bfa" font-family="system-ui" font-size="13">Visual Workflow Builder</text>
    <text x="190" y="0" fill="#a78bfa" font-family="system-ui" font-size="13">HMAC-Signed APIs</text>
    <text x="350" y="0" fill="#a78bfa" font-family="system-ui" font-size="13">GPT-4o Clause Summaries</text>
  </g>
  <!-- Floating particles -->
  <circle cx="380" cy="60" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#c084fc" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="750" cy="100" r="1.5" fill="#a78bfa" opacity="0.5"/>
</svg>
