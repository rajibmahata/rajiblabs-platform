<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Document + signature workflow -->
  <g transform="translate(420, 40)" filter="url(#glow)">
    <!-- Document -->
    <rect x="0" y="20" width="180" height="250" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="16" y="36" width="90" height="7" rx="3" fill="#6366f1" opacity="0.6"/>
    <rect x="16" y="50" width="148" height="4" rx="2" fill="#4f46e5" opacity="0.25"/>
    <rect x="16" y="60" width="140" height="4" rx="2" fill="#4f46e5" opacity="0.25"/>
    <rect x="16" y="70" width="148" height="4" rx="2" fill="#4f46e5" opacity="0.25"/>
    <rect x="16" y="80" width="120" height="4" rx="2" fill="#4f46e5" opacity="0.25"/>
    <rect x="16" y="90" width="135" height="4" rx="2" fill="#4f46e5" opacity="0.25"/>
    <!-- Clause summary box -->
    <rect x="16" y="106" width="148" height="40" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="0.5"/>
    <text x="90" y="120" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="7">GPT-4o Clause Summary</text>
    <rect x="24" y="126" width="100" height="3" rx="1" fill="#818cf8" opacity="0.3"/>
    <rect x="24" y="133" width="80" height="3" rx="1" fill="#818cf8" opacity="0.3"/>
    <!-- Signature line -->
    <line x1="16" y1="175" x2="164" y2="175" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4"/>
    <path d="M36,170 Q56,155 76,170 Q96,185 116,165" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <!-- Blockchain badge -->
    <rect x="16" y="190" width="60" height="22" rx="11" fill="#312e81" stroke="#818cf8" stroke-width="0.5"/>
    <text x="46" y="205" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="7">⛓ Notarised</text>
    <!-- HMAC badge -->
    <rect x="84" y="190" width="80" height="22" rx="11" fill="#312e81" stroke="#818cf8" stroke-width="0.5"/>
    <text x="124" y="205" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="7">🔒 HMAC Signed</text>
    <!-- Checkmark -->
    <circle cx="155" cy="28" r="12" fill="#10b981"/>
    <path d="M149,28 L153,32 L161,24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Workflow arrows -->
    <g opacity="0.5" stroke="#818cf8" stroke-width="1" fill="none">
      <path d="M200,60 L230,60 L230,100 L200,100" marker-end="url(#arrow)"/>
      <path d="M200,140 L230,140 L230,180 L200,180"/>
      <circle cx="240" cy="60" r="14" fill="none" stroke-dasharray="3,3"/><text x="240" y="64" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="9">1</text>
      <circle cx="240" cy="140" r="14" fill="none" stroke-dasharray="3,3"/><text x="240" y="144" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="9">2</text>
      <circle cx="240" cy="220" r="14" fill="none" stroke-dasharray="3,3"/><text x="240" y="224" text-anchor="middle" fill="#a5b4fc" font-family="system-ui" font-size="9">3</text>
      <text x="260" y="64" fill="#6366f1" font-family="system-ui" font-size="7">Create</text>
      <text x="260" y="144" fill="#6366f1" font-family="system-ui" font-size="7">Route</text>
      <text x="260" y="224" fill="#6366f1" font-family="system-ui" font-size="7">Sign</text>
    </g>
    <!-- Stripe badge -->
    <rect x="0" y="238" width="180" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="0.5"/>
    <text x="90" y="256" text-anchor="middle" fill="#818cf8" font-family="system-ui" font-size="9">💳 Stripe Payment Integration</text>
  </g>
  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1">DocuSign Hub</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#c4b5fd">Digital Signature SaaS — 140+ REST Endpoints</text>
  <!-- Features -->
  <g transform="translate(50, 205)" font-family="system-ui" font-size="11">
    <text y="0" fill="#a78bfa">▸</text><text x="16" y="0" fill="#e0e7ff">Visual Workflow Builder for Approval Chains</text>
    <text y="18" fill="#a78bfa">▸</text><text x="16" y="18" fill="#e0e7ff">HMAC-Signed API Authentication</text>
    <text y="36" fill="#a78bfa">▸</text><text x="16" y="36" fill="#e0e7ff">GPT-4o Clause Summaries</text>
    <text y="54" fill="#a78bfa">▸</text><text x="16" y="54" fill="#e0e7ff">Stripe Payments in Signing Flows</text>
    <text y="72" fill="#a78bfa">▸</text><text x="16" y="72" fill="#e0e7ff">Optional Blockchain Notarisation</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 300)">
    <rect width="56" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1"/><text x="28" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">.NET</text>
    <rect x="64" width="60" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1"/><text x="94" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">React</text>
    <rect x="132" width="56" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1"/><text x="160" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">Azure</text>
    <rect x="196" width="56" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1"/><text x="224" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">Stripe</text>
    <rect x="260" width="68" height="26" rx="13" fill="#312e81" stroke="#6366f1" stroke-width="1"/><text x="294" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">OpenAI</text>
  </g>
  <!-- Live badge -->
  <rect x="50" y="340" width="90" height="22" rx="11" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="0.5"/>
  <text x="95" y="355" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="10" font-weight="600">● LIVE NOW</text>
  <circle cx="390" cy="50" r="2" fill="#a78bfa" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#c084fc" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#818cf8" opacity="0.3"/>
</svg>
