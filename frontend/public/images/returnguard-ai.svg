<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#00d2ff" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- AI analysis pipeline -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <!-- Input: Returns -->
    <g transform="translate(0, 20)">
      <rect width="100" height="50" rx="8" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="10">📦 Returns</text>
      <text x="50" y="36" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Customer Data</text>
    </g>
    <!-- Whisper voice -->
    <g transform="translate(120, 20)">
      <rect width="80" height="50" rx="8" fill="#0f3460" stroke="#a78bfa" stroke-width="1"/>
      <text x="40" y="20" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="10">🎤 Whisper</text>
      <text x="40" y="36" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Voice Input</text>
    </g>
    <line x1="100" y1="45" x2="120" y2="45" stroke="#00d2ff" stroke-width="0.8" opacity="0.4"/>
    <!-- ChromaDB -->
    <g transform="translate(220, 20)">
      <rect width="90" height="50" rx="8" fill="#0f3460" stroke="#f59e0b" stroke-width="1"/>
      <text x="45" y="20" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="10">🔍 ChromaDB</text>
      <text x="45" y="36" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Vector Retrieval</text>
    </g>
    <line x1="200" y1="45" x2="220" y2="45" stroke="#a78bfa" stroke-width="0.8" opacity="0.4"/>
    <!-- GPT-4o analysis -->
    <g transform="translate(0, 100)">
      <rect width="310" height="80" rx="10" fill="#0f3460" stroke="#00d2ff" stroke-width="1.5"/>
      <text x="16" y="22" fill="#00d2ff" font-family="system-ui" font-size="10" font-weight="bold">🧠 GPT-4o Analysis</text>
      <rect x="16" y="30" width="278" height="36" rx="6" fill="#1a1a2e"/>
      <text x="26" y="44" fill="#e2e8f0" font-family="system-ui" font-size="8">Risk Score: <tspan fill="#ef4444" font-weight="bold">HIGH</tspan> (0.87)</text>
      <text x="26" y="58" fill="#a1a1aa" font-family="system-ui" font-size="7">Pattern: Serial returner — 14 returns in 30 days, similar items, different addresses</text>
      <rect x="16" y="68" width="50" height="12" rx="6" fill="#ef4444" opacity="0.2"/><text x="41" y="77" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="7">Block</text>
      <rect x="74" y="68" width="60" height="12" rx="6" fill="#f59e0b" opacity="0.2"/><text x="104" y="77" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="7">Review</text>
      <rect x="142" y="68" width="50" height="12" rx="6" fill="#22c55e" opacity="0.2"/><text x="167" y="77" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="7">Approve</text>
    </g>
    <!-- WebSocket realtime -->
    <g transform="translate(0, 200)">
      <rect width="310" height="40" rx="8" fill="#0f3460" stroke="#00d2ff" stroke-width="0.8" stroke-dasharray="4,4"/>
      <text x="155" y="18" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="9">⚡ Real-time WebSocket Updates</text>
      <text x="155" y="32" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Redis Cache • FastAPI Backend • React Frontend</text>
    </g>
    <!-- Multilingual badge -->
    <g transform="translate(0, 255)">
      <rect width="100" height="24" rx="12" fill="#0f3460" stroke="#a78bfa" stroke-width="0.5"/>
      <text x="50" y="16" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="8">🌐 Multilingual</text>
      <rect x="110" width="100" height="24" rx="12" fill="#0f3460" stroke="#00d2ff" stroke-width="0.5"/>
      <text x="160" y="16" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="8">🔒 Fraud Detection</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1">ReturnGuard AI</text>
  <text x="50" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a1a1aa">AI-Powered Return Fraud Detection — GPT-4o + Whisper</text>
  <!-- Features -->
  <g transform="translate(50, 200)" font-family="system-ui" font-size="11">
    <text y="0" fill="#00d2ff">▸</text><text x="16" y="0" fill="#e2e8f0">Multilingual Embeddings with ChromaDB Retrieval</text>
    <text y="18" fill="#00d2ff">▸</text><text x="16" y="18" fill="#e2e8f0">GPT-4o Analysis with Whisper Voice Input</text>
    <text y="36" fill="#00d2ff">▸</text><text x="16" y="36" fill="#e2e8f0">FastAPI + WebSockets + Redis Real-time</text>
    <text y="54" fill="#00d2ff">▸</text><text x="16" y="54" fill="#e2e8f0">React + TypeScript Frontend</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="72" height="26" rx="13" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/><text x="36" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">FastAPI</text>
    <rect x="80" width="80" height="26" rx="13" fill="#0f3460" stroke="#a78bfa" stroke-width="1"/><text x="120" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">ChromaDB</text>
    <rect x="168" width="62" height="26" rx="13" fill="#0f3460" stroke="#f59e0b" stroke-width="1"/><text x="199" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">GPT-4o</text>
    <rect x="238" width="56" height="26" rx="13" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/><text x="266" y="17" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10">React</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#00d2ff" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#a78bfa" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#00d2ff" opacity="0.3"/>
</svg>
