<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#f59e0b" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Freight matching dashboard -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <rect x="0" y="0" width="360" height="240" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="30" rx="12" fill="#1a1a2e"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444"/><circle cx="34" cy="15" r="5" fill="#eab308"/><circle cx="50" cy="15" r="5" fill="#22c55e"/>
    <text x="180" y="19" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="10">🚛 TruckIt365 — Freight Matching</text>
    <!-- Map visualization -->
    <g transform="translate(14, 38)">
      <rect width="165" height="120" rx="6" fill="#1a1a2e"/>
      <text x="82" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">📍 Route Map</text>
      <!-- Simplified map lines -->
      <line x1="30" y1="40" x2="135" y2="100" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
      <circle cx="30" cy="40" r="4" fill="#22c55e"/><text x="30" y="36" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="5">NYC</text>
      <circle cx="80" cy="65" r="3" fill="#f59e0b" opacity="0.6"/>
      <circle cx="135" cy="100" r="4" fill="#ef4444"/><text x="135" y="96" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="5">CHI</text>
      <text x="82" y="116" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Real-Time Tracking</text>
    </g>
    <!-- Load board -->
    <g transform="translate(187, 38)">
      <rect width="159" height="120" rx="6" fill="#1a1a2e"/>
      <text x="80" y="18" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="8" font-weight="bold">📋 Active Loads</text>
      <g transform="translate(8, 26)">
        <rect width="143" height="22" rx="4" fill="#16213e"/>
        <text x="10" y="15" fill="#e2e8f0" font-family="system-ui" font-size="6">NYC → CHI • 792 mi • $2,400</text>
        <rect x="110" y="4" width="26" height="12" rx="3" fill="#22c55e" opacity="0.2"/><text x="123" y="13" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="5">Open</text>
        <rect y="26" width="143" height="22" rx="4" fill="#16213e"/>
        <text x="10" y="41" fill="#e2e8f0" font-family="system-ui" font-size="6">LA → SEA • 1,135 mi • $3,100</text>
        <rect x="110" y="30" width="26" height="12" rx="3" fill="#f59e0b" opacity="0.2"/><text x="123" y="39" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="5">Bid</text>
        <rect y="52" width="143" height="22" rx="4" fill="#16213e"/>
        <text x="10" y="67" fill="#e2e8f0" font-family="system-ui" font-size="6">DAL → ATL • 781 mi • $1,900</text>
        <rect x="110" y="56" width="26" height="12" rx="3" fill="#ef4444" opacity="0.2"/><text x="123" y="65" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="5">Hot</text>
        <rect y="78" width="143" height="22" rx="4" fill="#16213e"/>
        <text x="10" y="93" fill="#e2e8f0" font-family="system-ui" font-size="6">SF → PHX • 750 mi • $2,200</text>
        <rect x="110" y="82" width="26" height="12" rx="3" fill="#22c55e" opacity="0.2"/><text x="123" y="91" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="5">Open</text>
      </g>
    </g>
    <!-- Stats -->
    <g transform="translate(14, 170)">
      <rect width="110" height="56" rx="6" fill="#1a1a2e"/>
      <text x="55" y="20" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="16" font-weight="bold">500+</text>
      <text x="55" y="34" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Carriers</text>
      <text x="55" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Listed on Platform</text>
      <rect x="120" width="110" height="56" rx="6" fill="#1a1a2e"/>
      <text x="175" y="20" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="16" font-weight="bold">$2M+</text>
      <text x="175" y="34" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Freight Moved</text>
      <text x="175" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Monthly Volume</text>
      <rect x="240" width="106" height="56" rx="6" fill="#1a1a2e"/>
      <text x="293" y="20" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="16" font-weight="bold">24h</text>
      <text x="293" y="34" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">Avg Match</text>
      <text x="293" y="48" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Load → Carrier</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">TruckIt365</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fcd34d">Freight-Matching Platform for Shippers &amp; Carriers</text>
  <text x="50" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Keshri Software Solutions — Company Product</text>
  <!-- Features -->
  <g transform="translate(50, 230)" font-family="system-ui" font-size="10">
    <text y="0" fill="#f59e0b">▸</text><text x="14" y="0" fill="#fef3c7">Real-Time Load Board with Route Matching</text>
    <text y="16" fill="#f59e0b">▸</text><text x="14" y="16" fill="#fef3c7">Shippers &amp; Carriers Connecting Directly</text>
    <text y="32" fill="#f59e0b">▸</text><text x="14" y="32" fill="#fef3c7">GPS Tracking &amp; Automated Pricing</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 290)">
    <rect width="50" height="24" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1"/><text x="25" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Web</text>
    <rect x="58" width="90" height="24" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1"/><text x="103" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Logistics</text>
    <rect x="156" width="60" height="24" rx="12" fill="#16213e" stroke="#f59e0b" stroke-width="1"/><text x="186" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Product</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#f59e0b" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#f97316" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#f59e0b" opacity="0.3"/>
</svg>
