<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#00d2ff" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Email triage pipeline -->
  <g transform="translate(400, 30)" filter="url(#glow)">
    <!-- Email inbox -->
    <g transform="translate(0, 20)">
      <rect width="100" height="60" rx="8" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="14">📧</text>
      <text x="50" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Email Inbox</text>
      <text x="50" y="52" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="7">100+ Daily</text>
    </g>
    <!-- n8n automation -->
    <g transform="translate(120, 20)">
      <rect width="100" height="60" rx="8" fill="#0f3460" stroke="#f59e0b" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="10" font-weight="bold">⚙️ n8n</text>
      <text x="50" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Automation</text>
      <text x="50" y="52" text-anchor="middle" fill="#fcd34d" font-family="system-ui" font-size="7">Workflow Engine</text>
    </g>
    <line x1="100" y1="50" x2="120" y2="50" stroke="#00d2ff" stroke-width="0.8" opacity="0.4"/>
    <!-- LLM classification -->
    <g transform="translate(240, 20)">
      <rect width="120" height="60" rx="8" fill="#0f3460" stroke="#a78bfa" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="10" font-weight="bold">🤖 LLM</text>
      <text x="60" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="8">Auto-Classify</text>
      <text x="60" y="52" text-anchor="middle" fill="#c084fc" font-family="system-ui" font-size="7">Priority • Category</text>
    </g>
    <line x1="220" y1="50" x2="240" y2="50" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
    <!-- Result dashboard -->
    <g transform="translate(0, 100)">
      <rect width="360" height="100" rx="10" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/>
      <text x="180" y="20" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="10" font-weight="bold">📊 Email Triage Dashboard</text>
      <g transform="translate(14, 30)">
        <rect width="100" height="28" rx="6" fill="#1a1a2e"/>
        <text x="50" y="12" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="10" font-weight="bold">🔴 Urgent: 12</text>
        <text x="50" y="24" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Auto-Escalated</text>
        <rect x="110" width="100" height="28" rx="6" fill="#1a1a2e"/>
        <text x="160" y="12" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="10" font-weight="bold">🟡 Review: 34</text>
        <text x="160" y="24" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Queued for Human</text>
        <rect x="220" width="100" height="28" rx="6" fill="#1a1a2e"/>
        <text x="270" y="12" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="10" font-weight="bold">🟢 Auto: 54</text>
        <text x="270" y="24" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="6">Auto-Responded</text>
      </g>
      <!-- Categories -->
      <g transform="translate(14, 66)">
        <rect width="70" height="22" rx="4" fill="#1a1a2e"/><text x="35" y="15" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="7">Sales</text>
        <rect x="78" width="70" height="22" rx="4" fill="#1a1a2e"/><text x="113" y="15" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="7">Support</text>
        <rect x="156" width="70" height="22" rx="4" fill="#1a1a2e"/><text x="191" y="15" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="7">Finance</text>
        <rect x="234" width="70" height="22" rx="4" fill="#1a1a2e"/><text x="269" y="15" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="7">Legal</text>
      </g>
    </g>
    <!-- GDPR badge -->
    <g transform="translate(0, 216)">
      <rect width="170" height="28" rx="14" fill="#0f3460" stroke="#00d2ff" stroke-width="0.5"/>
      <text x="85" y="18" text-anchor="middle" fill="#00d2ff" font-family="system-ui" font-size="8">🔒 GDPR Compliant • German SaaS</text>
      <rect x="180" width="170" height="28" rx="14" fill="#0f3460" stroke="#a78bfa" stroke-width="0.5"/>
      <text x="265" y="18" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="8">🤖 Multi-Tenant Langdock</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1">InboxPilot</text>
  <text x="50" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7dd3fc">Multi-Tenant SaaS Email Triage Platform</text>
  <!-- Features -->
  <g transform="translate(50, 200)" font-family="system-ui" font-size="10">
    <text y="0" fill="#00d2ff">▸</text><text x="14" y="0" fill="#e0f2fe">LLM-Powered Auto-Classification &amp; Response</text>
    <text y="16" fill="#00d2ff">▸</text><text x="14" y="16" fill="#e0f2fe">n8n Workflow Automation + Langdock Integration</text>
    <text y="32" fill="#00d2ff">▸</text><text x="14" y="32" fill="#e0f2fe">Multi-Tenant Architecture with GDPR Compliance</text>
    <text y="48" fill="#00d2ff">▸</text><text x="14" y="48" fill="#e0f2fe">German SaaS Client — Freelance → Product Pivot</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 270)">
    <rect width="44" height="24" rx="12" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/><text x="22" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">LLM</text>
    <rect x="52" width="50" height="24" rx="12" fill="#0f3460" stroke="#f59e0b" stroke-width="1"/><text x="77" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">n8n</text>
    <rect x="110" width="80" height="24" rx="12" fill="#0f3460" stroke="#a78bfa" stroke-width="1"/><text x="150" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">Langdock</text>
    <rect x="198" width="50" height="24" rx="12" fill="#0f3460" stroke="#00d2ff" stroke-width="1"/><text x="223" y="16" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="9">GDPR</text>
  </g>
  <circle cx="380" cy="50" r="2" fill="#00d2ff" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#a78bfa" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#00d2ff" opacity="0.3"/>
</svg>
