<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="50%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#0c0a09"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fbbf24" stroke-width="0.5"><line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/><line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/></g>
  <!-- Neural network + RAG pipeline -->
  <g transform="translate(430, 40)" filter="url(#glow)">
    <!-- Document ingestion -->
    <g transform="translate(0, 0)">
      <rect width="70" height="40" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="0.5"/>
      <text x="35" y="16" text-anchor="middle" fill="#d6d3d1" font-family="system-ui" font-size="7">📄 PDF</text>
      <text x="35" y="28" text-anchor="middle" fill="#d6d3d1" font-family="system-ui" font-size="7">📄 DOCX</text>
      <text x="35" y="36" text-anchor="middle" fill="#a8a29e" font-family="system-ui" font-size="6">+more</text>
    </g>
    <!-- Embedding step -->
    <g transform="translate(85, 5)">
      <rect width="60" height="30" rx="6" fill="#1c1917" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="30" y="19" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="8">Embed</text>
    </g>
    <line x1="70" y1="20" x2="85" y2="20" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>
    <!-- Vector DB -->
    <g transform="translate(160, 0)">
      <rect width="80" height="40" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1"/>
      <text x="40" y="16" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="8" font-weight="bold">ChromaDB</text>
      <text x="40" y="28" text-anchor="middle" fill="#a8a29e" font-family="system-ui" font-size="7">Vector Store</text>
      <text x="40" y="36" text-anchor="middle" fill="#78716c" font-family="system-ui" font-size="6">On-Premise</text>
    </g>
    <line x1="145" y1="20" x2="160" y2="20" stroke="#f97316" stroke-width="0.8" opacity="0.4"/>
    <!-- Neural network visualization -->
    <g transform="translate(255, 10)" opacity="0.7">
      <circle cx="0" cy="0" r="6" fill="#fbbf24"/><circle cx="0" cy="20" r="6" fill="#fbbf24"/><circle cx="0" cy="40" r="6" fill="#fbbf24"/>
      <circle cx="30" cy="10" r="5" fill="#f97316"/><circle cx="30" cy="30" r="5" fill="#f97316"/>
      <circle cx="60" cy="0" r="5" fill="#fb923c"/><circle cx="60" cy="20" r="5" fill="#fb923c"/><circle cx="60" cy="40" r="5" fill="#fb923c"/>
      <g stroke="#fbbf24" stroke-width="0.4" opacity="0.3">
        <line x1="6" y1="0" x2="25" y2="10"/><line x1="6" y1="0" x2="25" y2="30"/>
        <line x1="6" y1="20" x2="25" y2="10"/><line x1="6" y1="20" x2="25" y2="30"/>
        <line x1="6" y1="40" x2="25" y2="10"/><line x1="6" y1="40" x2="25" y2="30"/>
        <line x1="35" y1="10" x2="55" y2="0"/><line x1="35" y1="10" x2="55" y2="20"/>
        <line x1="35" y1="30" x2="55" y2="20"/><line x1="35" y1="30" x2="55" y2="40"/>
      </g>
    </g>
    <!-- LLM output -->
    <g transform="translate(0, 55)">
      <rect width="335" height="60" rx="8" fill="#1c1917" stroke="#fbbf24" stroke-width="0.8"/>
      <text x="12" y="18" fill="#fbbf24" font-family="system-ui" font-size="9" font-weight="bold">💬 Aria</text>
      <text x="12" y="32" fill="#d6d3d1" font-family="system-ui" font-size="8">"Based on your documents, the Q3 revenue</text>
      <text x="12" y="42" fill="#d6d3d1" font-family="system-ui" font-size="8"> increased by 18% due to the APAC expansion..."</text>
      <text x="12" y="54" fill="#78716c" font-family="system-ui" font-size="7">Sources: Q3-Report.pdf, APAC-Strategy.docx</text>
    </g>
    <!-- No-code pipeline label -->
    <rect x="0" y="130" width="335" height="28" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="0.5" stroke-dasharray="4,4"/>
    <text x="168" y="148" text-anchor="middle" fill="#a8a29e" font-family="system-ui" font-size="9">🔧 No-Code Multi-Agent Pipeline Builder</text>
    <!-- Agent cards -->
    <g transform="translate(0, 170)">
      <rect width="100" height="40" rx="6" fill="#1c1917" stroke="#fbbf24" stroke-width="0.5"/>
      <text x="50" y="16" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="8">🔍 Researcher</text>
      <text x="50" y="30" text-anchor="middle" fill="#78716c" font-family="system-ui" font-size="7">Semantic Search</text>
      <rect x="110" width="100" height="40" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="0.5"/>
      <text x="160" y="16" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="8">📝 Summariser</text>
      <text x="160" y="30" text-anchor="middle" fill="#78716c" font-family="system-ui" font-size="7">GPT-4o Powered</text>
      <rect x="220" width="100" height="40" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="0.5"/>
      <text x="270" y="16" text-anchor="middle" fill="#fb923c" font-family="system-ui" font-size="8">🤖 Avatar</text>
      <text x="270" y="30" text-anchor="middle" fill="#78716c" font-family="system-ui" font-size="7">Conversational UI</text>
    </g>
  </g>
  <!-- Title -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="white" letter-spacing="-1">Aria</text>
  <text x="50" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#d6d3d1">Enterprise Knowledge Platform — RAG + Multi-Agent</text>
  <!-- Features -->
  <g transform="translate(50, 200)" font-family="system-ui" font-size="11">
    <text y="0" fill="#fbbf24">▸</text><text x="16" y="0" fill="#e7e5e4">Documents → Queryable, Conversational Knowledge Base</text>
    <text y="18" fill="#fbbf24">▸</text><text x="16" y="18" fill="#e7e5e4">No-Code Multi-Agent Pipeline Builder</text>
    <text y="36" fill="#fbbf24">▸</text><text x="16" y="36" fill="#e7e5e4">ChromaDB — Deployable On-Premise, Zero Vendor Lock-in</text>
    <text y="54" fill="#fbbf24">▸</text><text x="16" y="54" fill="#e7e5e4">Avatar-Based Conversational Interaction</text>
  </g>
  <!-- Tech badges -->
  <g transform="translate(50, 285)">
    <rect width="36" height="26" rx="13" fill="#1c1917" stroke="#78716c" stroke-width="1"/><text x="18" y="17" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="10">AI</text>
    <rect x="44" width="44" height="26" rx="13" fill="#1c1917" stroke="#78716c" stroke-width="1"/><text x="66" y="17" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="10">LLM</text>
    <rect x="96" width="44" height="26" rx="13" fill="#1c1917" stroke="#78716c" stroke-width="1"/><text x="118" y="17" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="10">RAG</text>
    <rect x="148" width="82" height="26" rx="13" fill="#1c1917" stroke="#78716c" stroke-width="1"/><text x="189" y="17" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="10">ChromaDB</text>
    <rect x="238" width="50" height="26" rx="13" fill="#1c1917" stroke="#78716c" stroke-width="1"/><text x="263" y="17" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="10">Python</text>
  </g>
  <circle cx="400" cy="50" r="2" fill="#fbbf24" opacity="0.3"/><circle cx="780" cy="400" r="2.5" fill="#f97316" opacity="0.2"/><circle cx="30" cy="400" r="1.5" fill="#fbbf24" opacity="0.3"/>
</svg>
