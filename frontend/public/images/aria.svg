<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="50%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#0c0a09"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Neural network visualization -->
  <g transform="translate(440, 60)" filter="url(#glow)">
    <!-- Input layer -->
    <circle cx="0" cy="40" r="12" fill="#fbbf24" opacity="0.8"/>
    <circle cx="0" cy="80" r="12" fill="#fbbf24" opacity="0.8"/>
    <circle cx="0" cy="120" r="12" fill="#fbbf24" opacity="0.8"/>
    <circle cx="0" cy="160" r="12" fill="#fbbf24" opacity="0.8"/>
    <!-- Hidden layer 1 -->
    <circle cx="80" cy="30" r="10" fill="#f97316" opacity="0.8"/>
    <circle cx="80" cy="70" r="10" fill="#f97316" opacity="0.8"/>
    <circle cx="80" cy="110" r="10" fill="#f97316" opacity="0.8"/>
    <circle cx="80" cy="150" r="10" fill="#f97316" opacity="0.8"/>
    <circle cx="80" cy="190" r="10" fill="#f97316" opacity="0.8"/>
    <!-- Hidden layer 2 -->
    <circle cx="160" cy="50" r="10" fill="#fb923c" opacity="0.8"/>
    <circle cx="160" cy="90" r="10" fill="#fb923c" opacity="0.8"/>
    <circle cx="160" cy="130" r="10" fill="#fb923c" opacity="0.8"/>
    <circle cx="160" cy="170" r="10" fill="#fb923c" opacity="0.8"/>
    <!-- Output layer -->
    <circle cx="240" cy="80" r="14" fill="#fbbf24"/>
    <circle cx="240" cy="140" r="14" fill="#fbbf24"/>
    <!-- Connections -->
    <g stroke="#fbbf24" stroke-width="0.5" opacity="0.3">
      <line x1="12" y1="40" x2="70" y2="30"/><line x1="12" y1="40" x2="70" y2="70"/>
      <line x1="12" y1="80" x2="70" y2="70"/><line x1="12" y1="80" x2="70" y2="110"/>
      <line x1="12" y1="120" x2="70" y2="110"/><line x1="12" y1="120" x2="70" y2="150"/>
      <line x1="12" y1="160" x2="70" y2="150"/><line x1="12" y1="160" x2="70" y2="190"/>
      <line x1="90" y1="30" x2="150" y2="50"/><line x1="90" y1="70" x2="150" y2="50"/>
      <line x1="90" y1="70" x2="150" y2="90"/><line x1="90" y1="110" x2="150" y2="90"/>
      <line x1="90" y1="110" x2="150" y2="130"/><line x1="90" y1="150" x2="150" y2="130"/>
      <line x1="90" y1="150" x2="150" y2="170"/><line x1="90" y1="190" x2="150" y2="170"/>
      <line x1="170" y1="50" x2="226" y2="80"/><line x1="170" y1="90" x2="226" y2="80"/>
      <line x1="170" y1="90" x2="226" y2="140"/><line x1="170" y1="130" x2="226" y2="140"/>
      <line x1="170" y1="130" x2="226" y2="80"/><line x1="170" y1="170" x2="226" y2="140"/>
    </g>
    <!-- Labels -->
    <text x="0" y="220" text-anchor="middle" fill="#92400e" font-family="system-ui" font-size="9">Documents</text>
    <text x="80" y="220" text-anchor="middle" fill="#92400e" font-family="system-ui" font-size="9">Embed</text>
    <text x="160" y="220" text-anchor="middle" fill="#92400e" font-family="system-ui" font-size="9">Retrieve</text>
    <text x="240" y="220" text-anchor="middle" fill="#92400e" font-family="system-ui" font-size="9">Answer</text>
  </g>
  <!-- Title -->
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">Aria</text>
  <text x="60" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#d6d3d1">Enterprise Knowledge Platform</text>
  <!-- Tech badges -->
  <g transform="translate(60, 235)">
    <rect x="0" y="0" width="40" height="28" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
    <text x="20" y="18" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="11">AI</text>
    <rect x="48" y="0" width="50" height="28" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
    <text x="73" y="18" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="11">LLM</text>
    <rect x="106" y="0" width="50" height="28" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
    <text x="131" y="18" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="11">RAG</text>
    <rect x="164" y="0" width="82" height="28" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
    <text x="205" y="18" text-anchor="middle" fill="#e7e5e4" font-family="system-ui" font-size="11">ChromaDB</text>
  </g>
  <!-- Features -->
  <g transform="translate(60, 285)" opacity="0.7">
    <text x="0" y="0" fill="#fbbf24" font-family="system-ui" font-size="13">No-Code Pipeline Builder</text>
    <text x="210" y="0" fill="#fbbf24" font-family="system-ui" font-size="13">Multi-Agent System</text>
    <text x="395" y="0" fill="#fbbf24" font-family="system-ui" font-size="13">Semantic Search</text>
  </g>
  <!-- Floating particles -->
  <circle cx="380" cy="60" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#f97316" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#fbbf24" opacity="0.3"/>
  <circle cx="750" cy="100" r="1.5" fill="#fb923c" opacity="0.5"/>
</svg>
