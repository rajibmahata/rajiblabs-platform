<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a3e635"/>
      <stop offset="100%" style="stop-color:#84cc16"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Mobile app mockup -->
  <g transform="translate(460, 50)" filter="url(#glow)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="200" height="360" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="8" y="8" width="184" height="344" rx="18" fill="#1e293b"/>
    <!-- Status bar -->
    <rect x="70" y="12" width="60" height="4" rx="2" fill="#334155"/>
    <!-- App header -->
    <rect x="20" y="30" width="160" height="40" rx="8" fill="#14532d"/>
    <text x="100" y="55" text-anchor="middle" fill="#a3e635" font-family="system-ui" font-size="14" font-weight="bold">APCS</text>
    <!-- Job cards -->
    <rect x="20" y="80" width="160" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <circle cx="40" cy="100" r="10" fill="#14532d"/>
    <text x="40" y="104" text-anchor="middle" fill="#a3e635" font-family="system-ui" font-size="8">✓</text>
    <text x="60" y="98" fill="#e2e8f0" font-family="system-ui" font-size="10">123 Main St</text>
    <text x="60" y="114" fill="#64748b" font-family="system-ui" font-size="8">Completed • 2h ago</text>
    <rect x="130" y="92" width="40" height="18" rx="4" fill="#14532d"/>
    <text x="150" y="104" text-anchor="middle" fill="#a3e635" font-family="system-ui" font-size="8">View</text>
    <rect x="20" y="150" width="160" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <circle cx="40" cy="170" r="10" fill="#854d0e"/>
    <text x="40" y="174" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="8">⏱</text>
    <text x="60" y="168" fill="#e2e8f0" font-family="system-ui" font-size="10">456 Oak Ave</text>
    <text x="60" y="184" fill="#64748b" font-family="system-ui" font-size="8">In Progress • Tech: Raj</text>
    <rect x="130" y="162" width="40" height="18" rx="4" fill="#854d0e"/>
    <text x="150" y="174" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="8">Map</text>
    <rect x="20" y="220" width="160" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <circle cx="40" cy="240" r="10" fill="#1e3a5f"/>
    <text x="40" y="244" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="8">📅</text>
    <text x="60" y="238" fill="#e2e8f0" font-family="system-ui" font-size="10">789 Pine Rd</text>
    <text x="60" y="254" fill="#64748b" font-family="system-ui" font-size="8">Scheduled • Tomorrow 9am</text>
    <!-- Bottom nav -->
    <rect x="20" y="300" width="160" height="40" rx="8" fill="#0f172a"/>
    <text x="50" y="325" text-anchor="middle" fill="#a3e635" font-family="system-ui" font-size="8">Jobs</text>
    <text x="100" y="325" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">Map</text>
    <text x="150" y="325" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">Team</text>
  </g>
  <!-- Title -->
  <text x="60" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">APCS Pest Control</text>
  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">Real Business Software</text>
  <!-- Tech badge -->
  <g transform="translate(60, 225)">
    <rect x="0" y="0" width="50" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Web</text>
  </g>
  <!-- Features -->
  <g transform="translate(60, 275)" opacity="0.7">
    <text x="0" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">Live in Production</text>
    <text x="170" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">Real Pest Control Business</text>
    <text x="380" y="0" fill="#22d3ee" font-family="system-ui" font-size="13">Customer-Facing</text>
  </g>
  <!-- Floating particles -->
  <circle cx="380" cy="60" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="720" cy="350" r="3" fill="#06b6d4" opacity="0.3"/>
  <circle cx="50" cy="380" r="2" fill="#22d3ee" opacity="0.3"/>
  <circle cx="750" cy="100" r="1.5" fill="#0ea5e9" opacity="0.5"/>
</svg>
