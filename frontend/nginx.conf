# RajibLabs frontend — nginx serving React PWA + single FastAPI backend.
# All /api/* routes (public CMS, admin, auth, chat) proxy to ai-api:8000.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── PWA cache rules ──
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, must-revalidate";
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── FastAPI backend (all API routes) ──
  location /api/ {
    proxy_pass http://ai-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
  }
  location = /health {
    proxy_pass http://ai-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ── SPA fallback (must be last): /admin, /portfolio/*, /products/* → index.html ──
  location / {
    try_files $uri $uri/ /index.html;
  }
}
