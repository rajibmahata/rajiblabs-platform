# RajibLabs frontend — nginx serving React PWA + single FastAPI backend.
# All /api/* routes (public CMS, admin, auth, chat) proxy to ai-api:8000.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — resolve ai-api per-request so this nginx starts
  # before ai-api exists (no [emerg] host-not-found crash) and survives
  # ai-api container IP changes without a reload.
  resolver 127.0.0.11 valid=10s;
  set $ai_api http://ai-api:8000;

  # ── PWA cache rules ──
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, must-revalidate";
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── FastAPI backend (all API routes) ──
  location /api/ {
    proxy_pass $ai_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
  }
  location = /health {
    proxy_pass $ai_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Dynamic sitemap (backend lists published slugs; static file is fallback).
  location = /sitemap.xml {
    proxy_pass $ai_api;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 500 502 503 504 @sitemap_static;
  }
  location @sitemap_static {
    root /usr/share/nginx/html;
    rewrite ^ /sitemap.xml break;
  }

  # ── SPA fallback (must be last): /admin, /portfolio/*, /products/* → index.html ──
  location / {
    try_files $uri $uri/ /index.html;
  }
}
