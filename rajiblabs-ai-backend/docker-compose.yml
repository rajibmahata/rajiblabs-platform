services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/rajiblabs
    volumes:
      - ./data:/app/data
    depends_on:
      - mongo

volumes:
  mongo_data:
