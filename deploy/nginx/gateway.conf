# RajibLabs edge gateway — VPS 169.58.165.10 (plain HTTP, IP-only, no certs).
# Host path: /opt/rajiblabs/config/nginx/gateway.conf (mounted read-only).
# Upstreams resolve over the rajiblabs-internal Docker network.
# NOTE: /docs + /redoc are disabled by the API in production (APP_ENV),
# so no need to deny them here.
server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker embedded DNS — resolve upstreams per-request. Plain
    # proxy_pass hostnames resolve ONCE at nginx startup, so a gateway that
    # outlives a frontend/ai-api recreate keeps proxying to dead container
    # IPs (502 on / while /api/* still works, or vice versa).
    resolver 127.0.0.11 valid=10s;
    set $ai_api http://ai-api:8000;
    set $frontend http://frontend:80;

    # ── Health (ai-api) ──
    location = /health {
        proxy_pass $ai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API (ai-api: FastAPI serves every /api/* route) ──
    location /api/ {
        proxy_pass $ai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Resume/image uploads
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # ── Frontend PWA (React dist served by the frontend container) ──
    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
