# RajibLabs behind the existing edge proxy — Phase 2 (rajiblabs.com on the shared VPS)
#
# Use this ONLY after DNS for rajiblabs.com + www.rajiblabs.com points at the VPS
# AND Phase 1 (port :8080) is verified working. Until then, do nothing here.
#
# PRINCIPLE: additive only. Never edit, move, or reload PasteControl's existing
# server blocks. Add the blocks below, test the config, then reload.
#
# STEP 0 — discover how the existing edge terminates (run on the VPS):
#   ss -tlnp | grep -E ':80 |:443 '     # which process/container owns :80/:443
#   docker ps --format '{{.Names}}\t{{.Ports}}' | head -30
#
# STEP 1 — certificate (DNS must already resolve to this VPS):
#   certbot certonly --webroot -w <EXISTING-WEBROOT> \
#     -d rajiblabs.com -d www.rajiblabs.com
#   (Reuse PasteControl's webroot if it has one; otherwise any served dir works
#   as long as the :80 block below points at it.)
#
# STEP 2 — upstream reachability. Pick ONE (test with curl from the edge first):
#   A. Edge proxy runs on the HOST (bare nginx): proxy to 127.0.0.1:8080
#      (RajibLabs gateway publishes host :8080 — verify: curl -s -o /dev/null
#      -w "%{http_code}" http://127.0.0.1:8080/health  → expect 200).
#      Use the blocks below AS WRITTEN.
#   B. Edge proxy is itself a CONTAINER on another network: 127.0.0.1 inside
#      that container is NOT the host. Do NOT guess — first run:
#        docker network ls
#      then attach rajiblabs-gateway to that network by adding it under
#      gateway.networks in docker-compose.production.yml and re-running
#      deploy-vps.sh, and replace 127.0.0.1:8080 below with rajiblabs-gateway:80.
#
# STEP 3 — add the blocks, then SAFETY-VERIFY before reload:
#   <edge> nginx -t            (bare host nginx) OR
#   docker exec <edge-container> nginx -t
#   only if that passes:
#   systemctl reload nginx     OR     docker exec <edge-container> nginx -s reload
#   If reload fails, remove the added blocks and reload again — PasteControl
#   keeps serving throughout because its own blocks were never touched.

# ── HTTP: ACME challenge, then redirect ──
server {
    listen 80;
    server_name rajiblabs.com www.rajiblabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;  # ← change to the existing webroot if different
        default_type "text/plain";
    }

    location / {
        return 301 https://rajiblabs.com$request_uri;
    }
}

# ── HTTPS: RajibLabs PWA + API via the :8080 loopback ──
server {
    listen 443 ssl;
    http2 on;
    server_name rajiblabs.com;

    ssl_certificate     /etc/letsencrypt/live/rajiblabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajiblabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API docs stay disabled in production (APP_ENV) — deny anyway, defense in depth.
    location = /docs { deny all; }
    location = /redoc { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── www canonicalization ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.rajiblabs.com;

    ssl_certificate     /etc/letsencrypt/live/rajiblabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajiblabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://rajiblabs.com$request_uri;
}
