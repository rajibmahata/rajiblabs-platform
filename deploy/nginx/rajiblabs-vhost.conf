# -- RajibLabs (additive 2026-09-08; PestFlow blocks above untouched) --
server {
    listen 80;
    server_name rajiblabs.com www.rajiblabs.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name rajiblabs.com www.rajiblabs.com;
    ssl_certificate     /etc/letsencrypt/live/rajiblabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajiblabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s;
    set $rajiblabs http://rajiblabs-gateway:80;
    location /api/ {
        proxy_pass $rajiblabs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health {
        proxy_pass $rajiblabs;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass $rajiblabs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
