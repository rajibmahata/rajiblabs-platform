# RajibLabs — VPS deploy (169.58.165.10, shared box with PasteControl)
#
# True CI/CD: the VPS is NOT a git checkout. GitHub builds/tests, ships the
# exact committed tree as a tarball, and the server validates → syncs → builds.
#
# Flow per push/merge to main (+ manual "Run workflow"):
#   build-frontend → test-backend → deploy-vps (needs both green)
#   deploy-vps: git archive HEAD → scp tarball → extract to releases/<sha>/
#     → validate → rsync --delete → app/ → secrets → deploy-vps.sh
#     (build/up/health/smoke) → prune old releases (keep 2)
#
# PasteControl untouched: disjoint ports (:8080 vs :80/:443), names, networks,
# /opt paths — see CHANGELOG POCs. Rollback: sh deploy/rollback-vps.sh [<sha>].
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (+ optional VPS_SSH_PORT)
# for SSH; OPENAI_API_KEY, GITHUB_TOKEN, ADMIN_INITIAL_PASSWORD, SECRET_KEY,
# JWT_SECRET sync into /opt/rajiblabs/config/.env (non-empty win, never logged).
# One-time server setup: mkdir -p /opt/rajiblabs/{app,config,releases} and create
# /opt/rajiblabs/config/.env from deploy/dotenv.production.example. No git needed.
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b --verbose

      - name: Build frontend (PWA)
        working-directory: frontend
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: rajiblabs-ai-backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: rajiblabs-ai-backend
        env:
          DATABASE_URL: mongodb://localhost:27017/rajiblabs
        run: python -m pytest -q -p no:cacheprovider

  deploy-vps:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check VPS secrets
        id: check
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "VPS secrets not set — skipping. Set VPS_HOST, VPS_USER, VPS_SSH_KEY in GitHub Secrets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package exact committed tree
        if: steps.check.outputs.skip == 'false'
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # Tracked files only: no .git, no node_modules/dist, no local .env,
          # no secrets (repo holds placeholders/empties only).
          git archive --format=tar.gz --prefix=release/ -o "/tmp/rajiblabs-${SHA}.tgz" HEAD
          if tar tzf "/tmp/rajiblabs-${SHA}.tgz" | grep -E '(^|/)\.env$|/__pycache__/|/node_modules/|/dist/'; then
            echo "[ERROR] tarball contains excluded paths"; exit 1
          fi
          ls -la "/tmp/rajiblabs-${SHA}.tgz"

      - name: Transfer tarball to VPS
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "/tmp/rajiblabs-${{ env.SHA }}.tgz"
          target: "/opt/rajiblabs/releases/"
          timeout: 10m

      - name: Deploy release on VPS over SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1
        # App secrets: set these in GitHub Secrets and each deploy syncs the
        # non-empty ones into /opt/rajiblabs/config/.env (server file stays
        # as fallback for anything left empty here). Values never print in logs.
        env:
          DEPLOY_SHA: ${{ env.SHA }}
          APP_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 30m
          envs: DEPLOY_SHA,APP_OPENAI_API_KEY,APP_GITHUB_TOKEN,APP_ADMIN_INITIAL_PASSWORD,APP_SECRET_KEY,APP_JWT_SECRET
          script: |
            set -eu
            SHA="${DEPLOY_SHA}"
            APP_DIR=/opt/rajiblabs/app
            REL=/opt/rajiblabs/releases/"$SHA"
            # ── 1. Stage the release (RajibLabs paths only) ──
            mkdir -p /opt/rajiblabs/releases "$REL"
            tar xzf /opt/rajiblabs/releases/"$SHA".tgz -C "$REL"
            # tarball has release/ prefix → move contents up (no .git involved)
            mv "$REL"/release/* "$REL"/ 2>/dev/null || true
            mv "$REL"/release/.* "$REL"/ 2>/dev/null || true
            rmdir "$REL"/release 2>/dev/null || true
            # ── 2. Validate before touching the live tree ──
            [ -f "$REL/docker-compose.production.yml" ] || { echo "[ERROR] compose file missing in release"; exit 1; }
            [ -f "$REL/deploy/deploy-vps.sh" ] || { echo "[ERROR] deploy script missing in release"; exit 1; }
            [ -f "$REL/frontend/Dockerfile" ] || { echo "[ERROR] frontend Dockerfile missing in release"; exit 1; }
            [ -f "$REL/rajiblabs-ai-backend/Dockerfile" ] || { echo "[ERROR] backend Dockerfile missing in release"; exit 1; }
            command -v rsync >/dev/null 2>&1 || { echo "[ERROR] rsync not found on VPS (apt install rsync)"; exit 1; }
            sh -n "$REL/deploy/deploy-vps.sh"
            # ── 3. Sync live tree (near-atomic switch; stale files removed) ──
            mkdir -p "$APP_DIR"
            rsync -a --delete --exclude=.release "$REL/" "$APP_DIR/"
            echo "$SHA" > "$APP_DIR/.release"
            # Sync GitHub-Secret values into the server env file (non-empty win).
            upsert() { # upsert <FILE> <KEY> <VALUE>
              [ -n "${3:-}" ] || return 0
              [ -s "$1" ] && [ -n "$(tail -c 1 "$1")" ] && echo >> "$1"
              esc=$(printf '%s' "$3" | sed "s/'/'\\\\''/g")
              grep -v "^$2=" "$1" > "$1.tmp" || true
              printf "%s='%s'\n" "$2" "$esc" >> "$1.tmp"
              mv "$1.tmp" "$1"
            }
            ENV_FILE=/opt/rajiblabs/config/.env
            touch "$ENV_FILE"; chmod 600 "$ENV_FILE"
            upsert "$ENV_FILE" OPENAI_API_KEY "$APP_OPENAI_API_KEY"
            upsert "$ENV_FILE" GITHUB_TOKEN "$APP_GITHUB_TOKEN"
            upsert "$ENV_FILE" ADMIN_INITIAL_PASSWORD "$APP_ADMIN_INITIAL_PASSWORD"
            upsert "$ENV_FILE" SECRET_KEY "$APP_SECRET_KEY"
            upsert "$ENV_FILE" JWT_SECRET "$APP_JWT_SECRET"
            if [ -n "$APP_OPENAI_API_KEY" ]; then echo "  - OPENAI_API_KEY: from GitHub Secrets (AI enabled)"; else echo "  - OPENAI_API_KEY: server value kept (fallback mode if empty)"; fi
            # ── 4. Build/up/health/smoke via the release's own script ──
            DEPLOY_SHA="$SHA" sh "$APP_DIR/deploy/deploy-vps.sh"
            # ── 5. Prune old releases (keep 2 newest; SHA dirs + tarballs only) ──
            cd /opt/rajiblabs/releases
            seen=""; n=0
            ls -t | while IFS= read -r e; do
              b=${e%.tgz}
              case "$b" in [0-9a-f]*) [ ${#b} -eq 40 ] || continue;; *) continue;; esac
              case " $seen " in *" $b "*) continue;; esac
              seen="$seen $b"; n=$((n + 1))
              if [ "$n" -gt 2 ]; then rm -rf -- "$b" "$b.tgz"; fi
            done
            echo "Releases kept:"
            ls -t | head -n 6

      - name: Skip notice (no secrets)
        if: steps.check.outputs.skip == 'true'
        run: echo "VPS deploy skipped — configure VPS_HOST, VPS_USER, VPS_SSH_KEY to enable."
