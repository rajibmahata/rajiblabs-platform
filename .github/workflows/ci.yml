name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b --verbose

      - name: Build frontend (PWA)
        working-directory: frontend
        run: npm run build

      - name: Verify PWA artifacts
        working-directory: frontend
        run: |
          echo "Checking dist..."
          ls -lh dist/
          ls -lh dist/manifest.webmanifest dist/sw.js dist/offline.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/offline.html
          echo "PWA OK"

      - name: Restore backend
        working-directory: backend/RajibLabs.Api
        run: dotnet restore

      - name: Build backend
        working-directory: backend/RajibLabs.Api
        run: dotnet build --no-restore -c Release

      - name: Publish backend
        working-directory: backend/RajibLabs.Api
        run: dotnet publish -c Release -o publish

      - name: Copy frontend to backend wwwroot (for unified deploy)
        run: |
          rm -rf backend/RajibLabs.Api/publish/wwwroot
          cp -r frontend/dist backend/RajibLabs.Api/publish/wwwroot
          ls -lh backend/RajibLabs.Api/publish/wwwroot/index.html
          echo "Unified wwwroot ready"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/RajibLabs.Api/publish
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend publish
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend/RajibLabs.Api/publish

      - name: List dist for debug
        run: |
          echo "Production output (frontend/dist) to be deployed:"
          ls -R frontend/dist | head -100
          echo "---"
          ls -lh frontend/dist/index.html frontend/dist/assets/ | head -20

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check FTP secrets
        id: check
        run: |
          if [ -z "${{ secrets.FTP_PASS }}" ]; then
            echo "FTP secrets not set — skipping deploy. Set FTP_HOST, FTP_USER, FTP_PASS, FTP_PATH, SITE_URL in GitHub Secrets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "FTP secrets present"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: FTP diagnostics (safe, no password in URL)
        if: steps.check.outputs.skip == 'false'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -euo pipefail
          # Sanitize inputs - strip protocol, port, slashes that cause 550/malformed
          # Do not print password, do not put password in URL
          FTP_HOST_CLEAN="${FTP_HOST#ftp://}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN#ftps://}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%/*}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%:*}"
          FTP_PATH_CLEAN="${FTP_PATH#/}"
          FTP_PATH_CLEAN="${FTP_PATH%/}"
          echo "FTP diagnostics for host: $FTP_HOST_CLEAN"
          echo "FTP user: $FTP_USER"
          echo "FTP path (raw): '$FTP_PATH' -> cleaned: '$FTP_PATH_CLEAN' (empty means root)"
          echo ""
          echo "1) Testing FTP root (ftp://\$FTP_HOST:21/) — no path appended"
          echo "   Command: curl --ftp-pasv --list-only -u \"\$FTP_USER:***\" \"ftp://\$FTP_HOST:21/\" (password via -u, not in URL)"
          set +e
          echo "--- lftp ls root ---"
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; set net:timeout 15; ls; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST_CLEAN" 2>&1 | head -100
          LFTP_ROOT_EXIT=$?
          echo "lftp root exit: $LFTP_ROOT_EXIT"
          echo ""
          echo "--- curl list root ---"
          curl --ftp-pasv --list-only -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST_CLEAN:21/" 2>&1 | head -100
          CURL_ROOT_EXIT=$?
          echo "curl root exit: $CURL_ROOT_EXIT"
          echo ""
          # Determine if /rajiblabs is needed or if FTP is already scoped there
          # If root listing contains wwwroot/assets/index.html, then FTP root IS the site root (FTP_PATH should be empty or /)
          # If root listing contains rajiblabs folder, then FTP root is account root and we need /rajiblabs
          echo "2) Checking if /rajiblabs exists as subdirectory of root..."
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; cls -1; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST_CLEAN" 2>&1 | tr '\r' '\n' | head -50 > /tmp/ftp_root_list.txt || true
          cat /tmp/ftp_root_list.txt | head -50
          echo ""
          # User confirmed /rajiblabs is docroot — hardcode
          echo "→ Hosting panel /rajiblabs is docroot for rajiblabs.com — using /rajiblabs"
          echo "  Verified FTP path should be: rajiblabs"
          # Ensure we don't create nested
          if grep -q "^index.html" /tmp/ftp_root_list.txt && grep -q "^rajiblabs" /tmp/ftp_root_list.txt; then
            echo "  Do NOT use /rajiblabs/rajiblabs — live is at / (root)"
          fi
          echo ""
          if [ -n "$FTP_PATH_CLEAN" ]; then
            echo "3) Testing configured FTP_PATH: /$FTP_PATH_CLEAN"
            lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; ls \"$FTP_PATH_CLEAN\"; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST_CLEAN" 2>&1 | head -50 || echo "ls $FTP_PATH_CLEAN failed (may be root already)"
            curl --ftp-pasv --list-only -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST_CLEAN:21/$FTP_PATH_CLEAN/" 2>&1 | head -50 || true
          fi
          set -e
          echo ""
          echo "Diagnostics complete — see above to determine if FTP is scoped to /rajiblabs or needs /rajiblabs appended"

      - name: Deploy via FTP (verified root)
        if: steps.check.outputs.skip == 'false'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Normalize like deploy.sh
          FTP_HOST_CLEAN="${FTP_HOST#ftp://}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN#ftps://}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%/*}"
          FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%:*}"
          FTP_PATH_CLEAN="${FTP_PATH#/}"
          FTP_PATH_CLEAN="${FTP_PATH_CLEAN%/}"
          # Default to empty (root) if not set — means FTP is already at site root
          # The deploy.sh will handle verified path logic
          echo "Deploying to verified FTP root: $FTP_HOST_CLEAN${FTP_PATH_CLEAN:+/$FTP_PATH_CLEAN}/"
          FTP_HOST="$FTP_HOST_CLEAN" FTP_PATH="$FTP_PATH_CLEAN" FTP_USER="$FTP_USER" FTP_PASS="$FTP_PASS" SITE_URL="$SITE_URL" bash ./deploy.sh
          echo "Deploy script finished with exit: $?"

      - name: Deploy backend to /rajiblabs (unified)
        if: steps.check.outputs.skip == 'false'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          FTP_HOST_CLEAN="${FTP_HOST#ftp://}"; FTP_HOST_CLEAN="${FTP_HOST_CLEAN#ftps://}"; FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%/*}"; FTP_HOST_CLEAN="${FTP_HOST_CLEAN%%:*}"
          FTP_PATH_CLEAN="${FTP_PATH#/}"; FTP_PATH_CLEAN="${FTP_PATH_CLEAN%/}"
          FTP_PATH_CLEAN="${FTP_PATH_CLEAN:-rajiblabs}"
          echo "Deploying backend (with frontend wwwroot) to $FTP_HOST_CLEAN/$FTP_PATH_CLEAN ..."
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; mirror -R --parallel=2 --exclude-glob=.git* --exclude-glob=*.db backend/RajibLabs.Api/publish /$FTP_PATH_CLEAN; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST_CLEAN" 2>&1 | tail -50
          echo "Backend deploy done"

      - name: Verify deployment (HTTP 200)
        if: steps.check.outputs.skip == 'false'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          SITE_URL="${SITE_URL:-https://rajiblabs.com}"
          FTP_PATH_CLEAN="${FTP_PATH#/}"; FTP_PATH_CLEAN="${FTP_PATH_CLEAN%/}"
          echo "Verifying $SITE_URL ... (FTP_PATH=/${FTP_PATH_CLEAN:-<root>})"
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/home.html -w "%{http_code}" --max-time 15 "$SITE_URL/" || echo "000")
            echo "Attempt $i: $SITE_URL/ -> HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Homepage OK"
              head -20 /tmp/home.html
              break
            fi
            sleep 5
          done
          echo "Checking assets..."
          curl -s --head --max-time 10 "$SITE_URL/manifest.webmanifest" | head -5
          curl -s --head --max-time 10 "$SITE_URL/assets/" | head -5 || true
          # Freshness: live HTML must reference the just-built asset bundle
          BUILT_HASH=$(grep -o "index-[A-Za-z0-9_.-]*\.js" frontend/dist/index.html | head -1 || echo "")
          echo "Built bundle: $BUILT_HASH"
          if [ -n "$BUILT_HASH" ] && grep -q "$BUILT_HASH" /tmp/home.html; then
            echo "Freshness OK — live site serves the new build"
          else
            echo "WARNING: live site does not reference $BUILT_HASH yet (CDN/propagation delay?)"
          fi
          # Nested check: SPA fallback returns index.html (200) for unknown paths,
          # so only fail when nested content DIFFERS from / (a real stale nested copy)
          curl -s --max-time 10 "$SITE_URL/rajiblabs/rajiblabs/index.html" -o /tmp/nested.html || true
          if grep -q "RajibLabs" /tmp/nested.html 2>/dev/null && ! cmp -s /tmp/home.html /tmp/nested.html; then
            echo "WARNING: Found stale nested /rajiblabs/rajiblabs deployment — FTP path may be wrong!"
            exit 1
          fi
          echo "No stale nested deployment (identical body = SPA fallback, expected)"

      - name: Skip deploy (no secrets)
        if: steps.check.outputs.skip == 'true'
        run: echo "Deploy skipped — configure FTP secrets to enable auto-deploy to https://rajiblabs.com"
