name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b --verbose

      - name: Build frontend (PWA)
        working-directory: frontend
        run: npm run build

      - name: Verify PWA artifacts
        working-directory: frontend
        run: |
          echo "Checking dist..."
          ls -lh dist/
          ls -lh dist/manifest.webmanifest dist/sw.js dist/offline.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/offline.html
          echo "PWA OK"

      - name: Restore backend
        working-directory: backend/RajibLabs.Api
        run: dotnet restore

      - name: Build backend
        working-directory: backend/RajibLabs.Api
        run: dotnet build --no-restore -c Release

      - name: Publish backend
        working-directory: backend/RajibLabs.Api
        run: dotnet publish -c Release -o publish

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/RajibLabs.Api/publish
          retention-days: 7
