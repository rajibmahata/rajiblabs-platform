name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b --verbose

      - name: Build frontend (PWA)
        working-directory: frontend
        run: npm run build

      - name: Verify PWA artifacts
        working-directory: frontend
        run: |
          echo "Checking dist..."
          ls -lh dist/
          ls -lh dist/manifest.webmanifest dist/sw.js dist/offline.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/offline.html
          echo "PWA OK"

      - name: Restore backend
        working-directory: backend/RajibLabs.Api
        run: dotnet restore

      - name: Build backend
        working-directory: backend/RajibLabs.Api
        run: dotnet build --no-restore -c Release

      - name: Publish backend
        working-directory: backend/RajibLabs.Api
        run: dotnet publish -c Release -o publish

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/RajibLabs.Api/publish
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: List dist for debug
        run: |
          ls -lh frontend/dist/ | head -30
          ls -lh frontend/dist/sw.js frontend/dist/manifest.webmanifest 2>&1 | head -10

      - name: Install lftp (more reliable than curl for SmarterASP)
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check FTP secrets
        id: check
        run: |
          if [ -z "${{ secrets.FTP_PASS }}" ]; then
            echo "FTP secrets not set — skipping deploy (site will not update). Set FTP_HOST, FTP_USER, FTP_PASS, FTP_PATH, SITE_URL in GitHub Secrets."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Test FTP connection (debug)
        if: steps.check.outputs.skip == 'false'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          # Normalize like deploy.sh (strip ftp://, :21, slashes that cause 550/malformed)
          FTP_HOST="${FTP_HOST#ftp://}"
          FTP_HOST="${FTP_HOST#ftps://}"
          FTP_HOST="${FTP_HOST%%/*}"
          FTP_HOST="${FTP_HOST%%:*}"
          FTP_PATH="${FTP_PATH#/}"
          FTP_PATH="${FTP_PATH%/}"
          if [ -z "$FTP_PATH" ]; then FTP_PATH="site/wwwroot"; fi
          echo "Testing FTP list for $FTP_HOST/$FTP_PATH ..."
          echo "Normalized: HOST=$FTP_HOST PATH=$FTP_PATH USER=$FTP_USER"
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; ls \"$FTP_PATH\"; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" 2>&1 | head -50 || echo "lftp list $FTP_PATH failed, trying root..."
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; ls; bye" -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" 2>&1 | head -50 || true
          curl --ftp-pasv --list-only -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$FTP_PATH/" 2>&1 | head -50 || true
          curl --ftp-pasv --list-only -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1 | head -50 || true

      - name: Deploy via FTP (SmarterASP)
        if: steps.check.outputs.skip == 'false'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Skip deploy (no secrets)
        if: steps.check.outputs.skip == 'true'
        run: echo "Deploy skipped — configure FTP secrets to enable auto-deploy to https://rajiblabs.com"
