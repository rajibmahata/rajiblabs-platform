name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Typecheck frontend (tsc -b)
        working-directory: frontend
        run: npx tsc -b --verbose

      - name: Build frontend (PWA)
        working-directory: frontend
        run: npm run build

      - name: Verify PWA artifacts
        working-directory: frontend
        run: |
          ls -lh dist/manifest.webmanifest dist/sw.js dist/offline.html dist/icons/ | head -20
          test -f dist/manifest.webmanifest || (echo "manifest missing" && exit 1)
          test -f dist/sw.js || (echo "sw.js missing" && exit 1)
          echo "PWA artifacts OK"

      - name: Restore backend
        working-directory: backend/RajibLabs.Api
        run: dotnet restore

      - name: Build backend
        working-directory: backend/RajibLabs.Api
        run: dotnet build --no-restore -c Release

      - name: Publish backend (for deploy artifact)
        working-directory: backend/RajibLabs.Api
        run: dotnet publish -c Release -o publish

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/RajibLabs.Api/publish
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy via FTP (SmarterASP)
        if: ${{ secrets.FTP_HOST != '' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
